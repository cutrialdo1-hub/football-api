<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE GAFFER | Tactical Intelligence v2.1</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
    :root {
        --neon:   #00ff9d;
        --bg:     #0a0b10;
        --card:   #151821;
        --border: #2a2d3a;
        --away:   #ff3366;
        --draw:   #8892b0;
        --dim:    #4a5060;
        --gold:   #ffcc00;
    }

    * { box-sizing: border-box; }

    body {
        background: var(--bg); color: #fff;
        font-family: Inter, sans-serif;
        display: flex; justify-content: center;
        padding: 20px; min-height: 100vh;
    }

    .container { width: 100%; max-width: 480px; }

    h1 { font-family: Orbitron, sans-serif; color: var(--neon); text-align: center; letter-spacing: 5px; font-size: 1.2rem; margin-bottom: 6px; }
    .tagline { text-align: center; font-size: 0.65rem; color: var(--dim); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 24px; }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 20px; }

    input[type="date"] { width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 10px; background: #000; border: 1px solid var(--border); color: #fff; font-family: Inter, sans-serif; font-size: 0.9rem; }
    input[type="date"]:focus { outline: 1px solid var(--neon); }

    button {
        width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 10px;
        background: var(--neon); color: #000; font-weight: 800;
        font-family: Orbitron, sans-serif; font-size: 0.75rem; letter-spacing: 2px;
        cursor: pointer; border: none; transition: opacity 0.2s, box-shadow 0.2s;
    }
    button:hover:not(:disabled) { box-shadow: 0 0 18px rgba(0,255,157,0.35); }
    button:disabled { background: #1a1a1a; color: #444; cursor: not-allowed; box-shadow: none; }

    /* ── Fixture dropdown ── */
    .fixture-dropdown-toggle {
        width: 100%; display: flex; align-items: center; justify-content: space-between;
        background: #000; border: 1px solid var(--border); border-radius: 10px;
        padding: 12px 14px; margin-bottom: 0; cursor: pointer;
        transition: border-color 0.2s; user-select: none;
    }
    .fixture-dropdown-toggle:hover { border-color: rgba(0,255,157,0.4); box-shadow: none; }
    .fixture-dropdown-toggle.open  { border-color: var(--neon); border-radius: 10px 10px 0 0; border-bottom-color: transparent; }
    .fdt-left   { display: flex; flex-direction: column; gap: 2px; }
    .fdt-count  { font-family: Orbitron, sans-serif; font-size: 0.72rem; font-weight: 700; color: var(--neon); }
    .fdt-sub    { font-size: 0.58rem; color: var(--dim); letter-spacing: 1px; }
    .fdt-chevron { font-size: 0.75rem; color: var(--dim); transition: transform 0.25s; flex-shrink: 0; }
    .fixture-dropdown-toggle.open .fdt-chevron { transform: rotate(180deg); color: var(--neon); }

    .fixture-dropdown-panel {
        background: #000; border: 1px solid var(--neon); border-top: none;
        border-radius: 0 0 10px 10px; max-height: 0; overflow: hidden;
        transition: max-height 0.35s ease; margin-bottom: 12px;
    }
    .fixture-dropdown-panel.open { max-height: 420px; overflow-y: auto; padding: 8px 8px 4px; }

    .fixture-list { margin-bottom: 0; }

    .fixture-card {
        display: flex; align-items: center; justify-content: space-between;
        background: #0d0f16; border: 1px solid var(--border); border-radius: 8px;
        padding: 9px 12px; margin-bottom: 6px; cursor: pointer;
        transition: border-color 0.2s, background 0.2s;
        user-select: none; overflow: hidden;
    }
    .fixture-card:hover    { border-color: #3a3f50; background: #111318; }
    .fixture-card.selected { border-color: var(--neon); background: rgba(0,255,157,0.06); }

    .fx-left { flex: 1; min-width: 0; overflow: hidden; }
    .fx-teams { font-size: 0.78rem; font-weight: 600; color: #dde; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fx-meta  { font-size: 0.58rem; color: var(--dim); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fx-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; margin-left: 8px; }
    .fx-time  { font-family: Orbitron, sans-serif; font-size: 0.58rem; color: var(--dim); }
    .conf-badge { font-family: Orbitron, sans-serif; font-size: 0.52rem; font-weight: 700; letter-spacing: 0.5px; padding: 2px 6px; border-radius: 4px; white-space: nowrap; }
    .conf-HIGH { background: rgba(0,255,157,0.12); color: var(--neon); border: 1px solid rgba(0,255,157,0.25); }
    .conf-MED  { background: rgba(255,204,0,0.12);  color: var(--gold); border: 1px solid rgba(255,204,0,0.25); }
    .conf-LOW  { background: rgba(136,146,176,0.1); color: var(--draw); border: 1px solid rgba(136,146,176,0.15); }

    /* ── Bankroll row ── */
    .bankroll-row {
        display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
        background: #000; border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px;
    }
    .bankroll-row label { font-size: 0.65rem; letter-spacing: 2px; color: var(--dim); text-transform: uppercase; white-space: nowrap; flex-shrink: 0; }
    .bankroll-symbol { font-family: Orbitron, sans-serif; font-size: 0.85rem; color: var(--neon); flex-shrink: 0; }
    #bankroll-input { flex: 1; background: transparent; border: none; color: var(--neon); font-family: Orbitron, sans-serif; font-size: 0.85rem; padding: 0; margin: 0; outline: none; width: 100%; min-width: 0; }
    #bankroll-input::-webkit-inner-spin-button { -webkit-appearance: none; }

    /* ── Score ── */
    .score { font-family: Orbitron, sans-serif; font-size: 4rem; font-weight: 900; text-align: center; color: var(--neon); margin: 12px 0 4px; text-shadow: 0 0 24px rgba(0,255,157,0.4); }
    .lambda-row { display: flex; justify-content: center; gap: 20px; font-size: 0.65rem; color: var(--dim); letter-spacing: 1px; margin-bottom: 4px; }

    /* ── Prob bar ── */
    .prob-bar { display: flex; height: 24px; border-radius: 6px; overflow: hidden; margin: 16px 0; font-family: Orbitron, sans-serif; font-size: 0.65rem; line-height: 24px; text-align: center; }
    .p-h { background: var(--neon); color: #000; min-width: 28px; }
    .p-d { background: var(--draw); color: #000; min-width: 28px; }
    .p-a { background: var(--away); color: #000; min-width: 28px; }

    /* ── Form dots ── */
    .form-row { display: flex; gap: 3px; margin-top: 4px; flex-wrap: wrap; }
    .dot { width: 20px; height: 20px; border-radius: 4px; font-size: 10px; line-height: 20px; text-align: center; color: #000; font-weight: 700; display: inline-block; }
    .W { background: var(--neon); } .D { background: var(--draw); } .L { background: var(--away); } .Q { background: #2a2d3a; color: #556; border: 1px solid #333; }
    .form-venue-label { font-size: 0.58rem; letter-spacing: 2px; color: var(--dim); text-transform: uppercase; margin-top: 6px; margin-bottom: 2px; }

    .teams-row { display: flex; justify-content: space-between; align-items: flex-start; font-size: 0.82rem; margin-bottom: 4px; }
    .team-block { width: 48%; } .team-block.right { text-align: right; }
    .team-block b { font-size: 0.9rem; display: block; margin-bottom: 2px; }
    .team-block small { color: var(--dim); font-size: 0.7rem; }
    .team-block .form-row.right { justify-content: flex-end; }
    .team-block.right .form-venue-label { text-align: right; }

    .section-label { font-size: 0.6rem; letter-spacing: 3px; color: var(--dim); text-transform: uppercase; margin: 16px 0 8px; border-top: 1px solid #1a1d28; padding-top: 12px; }

    /* ── Market table ── */
    .market-table { width: 100%; border-collapse: collapse; }
    .market-table th { font-size: 0.6rem; letter-spacing: 2px; color: var(--dim); text-transform: uppercase; padding: 4px 0 8px; text-align: left; font-weight: 400; }
    .market-table th:last-child, .market-table td:last-child { text-align: right; }
    .market-row-tr { border-top: 1px solid #1a1d28; transition: background 0.25s; }
    .market-row-tr td { padding: 10px 4px; font-size: 0.8rem; vertical-align: middle; }

    .fair-price { font-family: Orbitron, sans-serif; font-size: 0.75rem; color: var(--neon); }

    .bookie-input { width: 72px; padding: 7px 8px; border-radius: 7px; background: #000; border: 1px solid var(--border); color: #fff; font-family: Orbitron, sans-serif; font-size: 0.72rem; text-align: center; transition: border-color 0.2s; }
    .bookie-input:focus { outline: none; border-color: var(--neon); }

    .kelly-result { font-family: Orbitron, sans-serif; font-size: 0.72rem; color: var(--dim); min-width: 80px; text-align: right; }
    .market-row-tr.value { background: rgba(0,255,157,0.05); }
    .market-row-tr.value td:first-child { border-left: 2px solid var(--neon); padding-left: 8px; }

    .prime { color: var(--neon); font-weight: 700; animation: pulse-text 2s ease-in-out infinite; }
    @keyframes pulse-text { 0%,100%{opacity:1;} 50%{opacity:0.6;} }

    /* Market type badges */
    .mkt-badge { display: inline-block; font-family: Orbitron, sans-serif; font-size: 0.52rem; font-weight: 700; letter-spacing: 1px; padding: 2px 6px; border-radius: 4px; margin-left: 4px; vertical-align: middle; }
    .mkt-1X2   { background: rgba(0,255,157,0.12);  color: var(--neon); border: 1px solid rgba(0,255,157,0.25); }
    .mkt-DC    { background: rgba(79,195,247,0.12); color: #4fc3f7;     border: 1px solid rgba(79,195,247,0.25); }
    .mkt-AH    { background: rgba(255,152,0,0.12);  color: #ff9800;     border: 1px solid rgba(255,152,0,0.25); }
    .mkt-Goals { background: rgba(255,204,0,0.12);  color: var(--gold); border: 1px solid rgba(255,204,0,0.25); }

    /* ══════════════════════════════════════════
       VISUALISATION SYSTEM
       ══════════════════════════════════════════ */

    /* ── Shared bar component ── */
    .vis-block {
        margin-bottom: 10px;
    }
    .vis-label-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 4px;
    }
    .vis-label {
        font-size: 0.6rem;
        letter-spacing: 1.5px;
        color: var(--dim);
        text-transform: uppercase;
    }
    .vis-value {
        font-family: Orbitron, sans-serif;
        font-size: 0.72rem;
        font-weight: 700;
    }
    .vis-bar-track {
        height: 8px;
        background: #1a1d28;
        border-radius: 4px;
        overflow: hidden;
        margin-bottom: 3px;
    }
    .vis-bar-fill {
        height: 100%;
        border-radius: 4px;
        transition: width 0.5s ease;
    }
    .vis-desc {
        font-size: 0.6rem;
        color: var(--dim);
        line-height: 1.4;
    }

    /* Colour scales */
    .bar-prob-high  { background: var(--neon); box-shadow: 0 0 6px rgba(0,255,157,0.4); }
    .bar-prob-mid   { background: var(--gold); }
    .bar-prob-low   { background: var(--away); }
    .bar-conf-high  { background: var(--neon); box-shadow: 0 0 6px rgba(0,255,157,0.4); }
    .bar-conf-mid   { background: var(--gold); }
    .bar-conf-low   { background: #555; }

    /* ── Verdict card visualisation panel ── */
    .verdict-vis-panel {
        background: #0d0f16;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px;
        margin: 14px 0;
    }
    .verdict-vis-title {
        font-size: 0.6rem;
        letter-spacing: 3px;
        color: var(--dim);
        text-transform: uppercase;
        margin-bottom: 14px;
        padding-bottom: 8px;
        border-bottom: 1px solid #1a1d28;
    }
    .verdict-vis-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
    }

    /* ── Value threshold bar ── */
    .value-threshold-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 4px;
    }
    .vt-track {
        flex: 1;
        height: 6px;
        background: #1a1d28;
        border-radius: 3px;
        overflow: hidden;
        position: relative;
    }
    .vt-fill {
        height: 100%;
        border-radius: 3px;
        transition: width 0.4s ease;
    }
    .vt-fill.pos  { background: var(--neon); box-shadow: 0 0 6px rgba(0,255,157,0.4); }
    .vt-fill.thin { background: var(--gold); }
    .vt-fill.neg  { background: var(--away); }
    .vt-label {
        font-family: Orbitron, sans-serif;
        font-size: 0.6rem;
        min-width: 50px;
        text-align: right;
    }
    .vt-label.pos  { color: var(--neon); }
    .vt-label.thin { color: var(--gold); }
    .vt-label.neg  { color: var(--away); }

    /* ── Fair price context band ── */
    .fair-context {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 3px;
    }
    .fc-track {
        flex: 1;
        height: 6px;
        background: linear-gradient(to right, #1a1d28 0%, rgba(0,255,157,0.3) 30%, rgba(0,255,157,0.6) 55%, rgba(255,204,0,0.4) 75%, #1a1d28 100%);
        border-radius: 3px;
        position: relative;
    }
    .fc-marker {
        position: absolute;
        top: -3px;
        width: 4px;
        height: 12px;
        background: #fff;
        border-radius: 2px;
        transform: translateX(-50%);
        box-shadow: 0 0 4px rgba(255,255,255,0.6);
    }
    .fc-label {
        font-size: 0.58rem;
        color: var(--dim);
        white-space: nowrap;
    }

    /* ── Compact vis for fixture list ── */
    .compact-vis {
        display: flex;
        gap: 6px;
        margin-top: 5px;
        align-items: center;
    }
    .compact-bar-wrap {
        flex: 1;
        height: 4px;
        background: #1a1d28;
        border-radius: 2px;
        overflow: hidden;
    }
    .compact-bar-fill {
        height: 100%;
        border-radius: 2px;
    }
    .compact-label {
        font-size: 0.55rem;
        color: var(--dim);
        white-space: nowrap;
        min-width: 26px;
        text-align: right;
    }

    .gaffer-box { background: rgba(0,255,157,0.04); border-left: 3px solid var(--neon); border-radius: 0 8px 8px 0; padding: 14px 16px; margin-top: 16px; font-size: 0.82rem; line-height: 1.65; color: #b0bcc8; }
    .gaffer-box .signature { font-family: Orbitron, sans-serif; color: var(--neon); font-size: 0.65rem; letter-spacing: 3px; text-align: right; margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(0,255,157,0.1); }

    /* ── Suggested Markets Panel ── */
    .suggested-panel {
        background: rgba(0,255,157,0.04);
        border: 1px solid rgba(0,255,157,0.2);
        border-radius: 12px;
        padding: 14px 16px;
        margin: 14px 0;
    }
    .suggested-title {
        font-family: Orbitron, sans-serif;
        font-size: 0.6rem;
        letter-spacing: 2px;
        color: var(--neon);
        text-transform: uppercase;
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .suggested-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 9px 0;
        border-top: 1px solid rgba(0,255,157,0.08);
    }
    .suggested-item:first-of-type { border-top: none; }
    .suggested-left { flex: 1; min-width: 0; }
    .suggested-mkt-name {
        font-size: 0.82rem;
        font-weight: 600;
        color: #dde;
        margin-bottom: 3px;
    }
    .suggested-instruction {
        font-size: 0.62rem;
        color: var(--dim);
        line-height: 1.4;
    }
    .suggested-right {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 3px;
        flex-shrink: 0;
        margin-left: 12px;
    }
    .suggested-fair {
        font-family: Orbitron, sans-serif;
        font-size: 0.85rem;
        font-weight: 700;
        color: var(--neon);
    }
    .suggested-prob {
        font-family: Orbitron, sans-serif;
        font-size: 0.6rem;
        color: var(--dim);
    }
    .suggested-type-badge {
        font-family: Orbitron, sans-serif;
        font-size: 0.48rem;
        font-weight: 700;
        letter-spacing: 1px;
        padding: 2px 5px;
        border-radius: 3px;
    }
    .no-value-panel {
        background: rgba(136,146,176,0.06);
        border: 1px solid rgba(136,146,176,0.15);
        border-radius: 12px;
        padding: 12px 16px;
        margin: 14px 0;
        font-size: 0.72rem;
        color: var(--draw);
        text-align: center;
        line-height: 1.5;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status-msg { text-align: center; font-size: 0.75rem; color: var(--dim); padding: 10px 0; }
    .error-msg  { text-align: center; font-size: 0.78rem; color: var(--away); padding: 12px 0; }
</style>
</head>
<body>
<div class="container">

    <h1>THE GAFFER</h1>
    <p class="tagline">Tactical Intelligence · Poisson Engine</p>

    <div class="card">
        <input type="date" id="date">
        <button onclick="getFixtures()">SCAN TACTICAL BOARD</button>

        <!-- Fixture dropdown — hidden until scan runs -->
        <div id="fixture-dropdown" style="display:none;">
            <div class="fixture-dropdown-toggle" id="fdt-toggle" onclick="toggleFixtureDropdown()">
                <div class="fdt-left">
                    <div class="fdt-count" id="fdt-count">0 Fixtures Found</div>
                    <div class="fdt-sub" id="fdt-sub">Tap to browse</div>
                </div>
                <div class="fdt-chevron">▼</div>
            </div>
            <div class="fixture-dropdown-panel" id="fdt-panel">
                <div id="fixture-list" class="fixture-list"></div>
            </div>
        </div>

        <div id="fixture-status"></div>
        <button id="btn" onclick="predict()" disabled>GET VERDICT</button>
        <button onclick="window.location.href='acca.html'" style="background:#000;color:var(--neon);border:1px solid var(--neon);margin-bottom:0;">⚡ ACCA BUILDER</button>
        <button onclick="window.location.href='session.html'" style="background:#000;color:#ffcc00;border:1px solid #ffcc00;margin-top:12px;margin-bottom:0;">🎯 MASANIELLO</button>
    </div>

    <div id="output"></div>

</div>

<script>
const API = "https://football-api-9e4p.onrender.com";
let fixturesData  = [];
let selectedIndex = null;
let _serverWarm   = false;

// ── Silent server wake-up on page load ──
// Pings the server immediately so by the time the user
// picks a date and presses SCAN, the server is already warm.
async function keepAlive() {
    try {
        const r = await fetch(`${API}/ping`);
        const d = await r.json();
        _serverWarm = d.warm;
        console.log(`[GAFFER] Server warm: ${_serverWarm}`);
    } catch(e) {
        console.log("[GAFFER] Server warming up...");
    }
}
keepAlive();

function getBankroll() {
    const el = document.getElementById("bankroll-input");
    const val = el ? parseFloat(el.value) : 1000;
    return (!val || isNaN(val) || val <= 0) ? 1000 : val;
}

function refreshKellyStakes() {
    document.querySelectorAll(".bookie-input").forEach(input => {
        if (input.value) {
            const fairOdds = parseFloat(input.dataset.fair || "0");
            const kellyId  = input.dataset.kelly;
            if (fairOdds && kellyId) calcKelly(input, fairOdds, kellyId);
        }
    });
}

document.getElementById("date").value = new Date().toISOString().split("T")[0];

function toggleFixtureDropdown() {
    const toggle = document.getElementById("fdt-toggle");
    const panel  = document.getElementById("fdt-panel");
    const isOpen = toggle.classList.contains("open");
    toggle.classList.toggle("open", !isOpen);
    panel.classList.toggle("open", !isOpen);
}

function openFixtureDropdown() {
    document.getElementById("fdt-toggle").classList.add("open");
    document.getElementById("fdt-panel").classList.add("open");
}

function closeFixtureDropdown() {
    document.getElementById("fdt-toggle").classList.remove("open");
    document.getElementById("fdt-panel").classList.remove("open");
}

function selectFixture(idx) {
    selectedIndex = idx;
    document.querySelectorAll(".fixture-card").forEach(c => {
        c.classList.toggle("selected", parseInt(c.dataset.idx) === idx);
    });
    document.getElementById("btn").disabled = false;
    document.getElementById("output").innerHTML = "";
    // Auto-close dropdown after selection
    closeFixtureDropdown();
    // Update toggle subtitle to show selected match
    const m = fixturesData[idx];
    if (m) {
        document.getElementById("fdt-sub").textContent = `✓ ${m.home} vs ${m.away} selected`;
    }
}

function renderFixtureList(fixtures) {
    const list   = document.getElementById("fixture-list");
    const dropdown = document.getElementById("fixture-dropdown");
    const status = document.getElementById("fixture-status");

    if (!fixtures.length) {
        dropdown.style.display = "none";
        status.innerHTML = `<div class="status-msg">No matches found for this date.</div>`;
        return;
    }

    // Count by tier
    const counts = {HIGH:0, MED:0, LOW:0};
    fixtures.forEach(m => counts[m.tier || "LOW"]++);

    // Update toggle header
    document.getElementById("fdt-count").textContent =
        `📋 ${fixtures.length} Fixture${fixtures.length !== 1 ? "s" : ""} Found`;
    document.getElementById("fdt-sub").textContent =
        `${counts.HIGH} HIGH · ${counts.MED} MED · ${counts.LOW} LOW — Tap to browse`;

    // Sort: by kickoff time, HIGH first within same time
    const sorted = [...fixtures].map((m,i) => ({...m, _origIdx: i}));
    sorted.sort((a,b) => {
        const ta = a.kickoff || a.date; const tb = b.kickoff || b.date;
        if (ta !== tb) return ta < tb ? -1 : 1;
        return b.confidence - a.confidence;
    });

    list.innerHTML = sorted.map(m => {
        const idx = m._origIdx;
        let timeStr = "";
        if (m.kickoff && m.kickoff.length > 10) {
            try { timeStr = new Date(m.kickoff).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}); }
            catch(e) {}
        }
        const tier   = m.tier || "LOW";
        const cpct   = Math.min(100, Math.round(((m.confidence||0) / 0.50) * 100));
        const ppct   = m.pick_prob || 0;
        const pbCls  = ppct >= 55 ? "bar-prob-high" : ppct >= 40 ? "bar-prob-mid" : "bar-prob-low";
        const cbCls  = cpct >= 50 ? "bar-conf-high" : cpct >= 25 ? "bar-conf-mid" : "bar-conf-low";

        return `<div class="fixture-card" data-idx="${idx}" onclick="selectFixture(${idx})">
            <div class="fx-left">
                <div class="fx-teams">${m.home} vs ${m.away}</div>
                <div class="fx-meta">${m.league}</div>
                <div class="compact-vis">
                    <span style="font-size:0.52rem;color:var(--dim);min-width:28px;">Prob</span>
                    <div class="compact-bar-wrap">
                        <div class="compact-bar-fill ${pbCls}" style="width:${ppct}%"></div>
                    </div>
                    <span class="compact-label">${ppct}%</span>
                </div>
                <div class="compact-vis">
                    <span style="font-size:0.52rem;color:var(--dim);min-width:28px;">Conf</span>
                    <div class="compact-bar-wrap">
                        <div class="compact-bar-fill ${cbCls}" style="width:${cpct}%"></div>
                    </div>
                    <span class="compact-label">${cpct}%</span>
                </div>
            </div>
            <div class="fx-right">
                ${timeStr ? `<div class="fx-time">${timeStr}</div>` : ""}
                <span class="conf-badge conf-${tier}">${tier}</span>
            </div>
        </div>`;
    }).join("");

    // Show dropdown and auto-open it
    dropdown.style.display = "block";
    status.innerHTML = "";
    openFixtureDropdown();
}

async function getFixtures(attempt = 1) {
    const MAX_ATTEMPTS = 4;
    const RETRY_DELAY  = 4000;

    const d      = document.getElementById("date").value;
    const status = document.getElementById("fixture-status");
    const out    = document.getElementById("output");
    if (!d) return;

    selectedIndex = null;
    document.getElementById("btn").disabled = true;
    document.getElementById("fixture-dropdown").style.display = "none";
    out.innerHTML = "";

    if (attempt === 1) {
        status.innerHTML = `<div class="status-msg">
            <div class="loader" style="width:20px;height:20px;margin:8px auto 4px;border-width:2px;"></div>
            Scanning fixtures...
        </div>`;
    } else {
        status.innerHTML = `<div class="status-msg">
            <div class="loader" style="width:20px;height:20px;margin:8px auto 4px;border-width:2px;"></div>
            Server warming up... (attempt ${attempt}/${MAX_ATTEMPTS})
        </div>`;
    }

    try {
        const res  = await fetch(`${API}/scan?date_from=${d}&date_to=${d}`);
        const data = await res.json();

        if (data.status === "loading") {
            if (attempt < MAX_ATTEMPTS) {
                status.innerHTML = `<div class="status-msg">
                    <div class="loader" style="width:20px;height:20px;margin:8px auto 4px;border-width:2px;"></div>
                    Syncing match data... retrying in ${RETRY_DELAY/1000}s
                </div>`;
                setTimeout(() => getFixtures(attempt + 1), RETRY_DELAY);
                return;
            }
            status.innerHTML = `<div class="status-msg">📋 Still syncing — please try again in a moment.</div>`;
            return;
        }
        if (data.error) {
            if (attempt < MAX_ATTEMPTS) { setTimeout(() => getFixtures(attempt + 1), RETRY_DELAY); return; }
            status.innerHTML = `<div class="error-msg">⚡ ${data.error}</div>`;
            return;
        }
        if (data.status === "no_games") {
            status.innerHTML = `<div class="status-msg">📋 No matches scheduled for this date.</div>`;
            return;
        }

        fixturesData = Array.isArray(data) ? data : [];
        if (!fixturesData.length) {
            status.innerHTML = `<div class="status-msg">No matches found.</div>`;
            return;
        }
        status.innerHTML = "";
        _serverWarm = true;
        renderFixtureList(fixturesData);

    } catch(e) {
        if (attempt < MAX_ATTEMPTS) {
            status.innerHTML = `<div class="status-msg">
                <div class="loader" style="width:20px;height:20px;margin:8px auto 4px;border-width:2px;"></div>
                Server waking up... retrying in ${RETRY_DELAY/1000}s
            </div>`;
            setTimeout(() => getFixtures(attempt + 1), RETRY_DELAY);
            return;
        }
        status.innerHTML = `<div class="error-msg">⚡ Connection lost. Check your link and retry.</div>`;
    }
}

function renderForm(str, align="left", venueLabel="") {
    const isRight = align === "right";
    const justifyStyle = `justify-content:${isRight ? "flex-end" : "flex-start"}`;
    const labelHtml = venueLabel ? `<div class="form-venue-label">${venueLabel}</div>` : "";
    if (!str || str === "???") {
        return `${labelHtml}<div class="form-row" style="${justifyStyle}">
            <div class="dot Q">?</div><div class="dot Q">?</div><div class="dot Q">?</div></div>`;
    }
    const dots = str.split("").map(c => {
        const cls = ["W","D","L"].includes(c) ? c : "Q";
        return `<div class="dot ${cls}">${c}</div>`;
    }).join("");
    return `${labelHtml}<div class="form-row" style="${justifyStyle}">${dots}</div>`;
}

function calcKelly(inputEl, fairOdds, targetId) {
    const target   = document.getElementById(targetId);
    const row      = inputEl.closest(".market-row-tr");
    const val      = parseFloat(inputEl.value);
    const bankroll = getBankroll();
    row.classList.remove("value");

    if (!val || isNaN(val) || val <= 1.0 || !fairOdds || fairOdds <= 1) {
        target.innerHTML = `<span class="no-value">--</span>`; return;
    }

    const p      = 1/fairOdds; const q = 1-p; const b = val-1;
    const f_star = (b*p-q)/b;
    const edge   = (val/fairOdds)-1;
    const edgePct = (edge*100).toFixed(1);
    const barW   = Math.min(100, Math.abs(edge)*500);

    if (edge <= 0) {
        target.innerHTML = `
            <div class="vt-track"><div class="vt-fill neg" style="width:${barW}%"></div></div>
            <span class="vt-label neg" style="font-size:0.58rem;">${edgePct}%</span>`;
        return;
    }
    if (edge <= 0.05) {
        target.innerHTML = `
            <div class="vt-track"><div class="vt-fill thin" style="width:${barW}%"></div></div>
            <span class="vt-label thin" style="font-size:0.58rem;">Thin</span>`;
        return;
    }
    if (f_star <= 0) {
        target.innerHTML = `<span class="no-value">No edge</span>`; return;
    }

    const stake = (0.25 * f_star * bankroll).toFixed(2);
    row.classList.add("value");
    target.innerHTML = `
        <div class="vt-track"><div class="vt-fill pos" style="width:${Math.min(100,barW)}%"></div></div>
        <span class="vt-label pos" style="font-size:0.6rem;">+${edgePct}%</span>
        <span class="prime" style="display:block;font-size:0.7rem;text-align:right;margin-top:2px;">★ €${stake}</span>`;
}

// ── Visualisation helpers ──

function probBarClass(pct) {
    if (pct >= 55) return "bar-prob-high";
    if (pct >= 40) return "bar-prob-mid";
    return "bar-prob-low";
}

function confBarClass(conf) {
    // conf = confidence gap (0-1 float from backend)
    if (conf >= 0.25) return "bar-conf-high";
    if (conf >= 0.12) return "bar-conf-mid";
    return "bar-conf-low";
}

function confPct(conf) {
    // Map 0–0.50 range to 0–100% display
    return Math.min(100, Math.round((conf / 0.50) * 100));
}

function confDesc(conf) {
    if (conf >= 0.25) return "Model clearly separates this outcome from alternatives";
    if (conf >= 0.12) return "Moderate separation — check both top markets";
    return "Closely contested — predictions carry higher uncertainty";
}

function probDesc(pct) {
    if (pct >= 60) return "Strong model conviction on this outcome";
    if (pct >= 45) return "Model sees a genuine contest — neither side dominant";
    return "Lower probability outcome — higher variance bet";
}

function fairPricePos(fair) {
    // Map fair odds to 0–100% position on the context band
    // 1.40 = 10%, 2.00 = 40%, 2.50 = 60%, 3.50 = 85%, 4.00+ = 95%
    if (fair <= 1.40) return 5;
    if (fair <= 2.00) return 10 + ((fair - 1.40) / 0.60) * 30;
    if (fair <= 2.50) return 40 + ((fair - 2.00) / 0.50) * 20;
    if (fair <= 3.50) return 60 + ((fair - 2.50) / 1.00) * 25;
    return Math.min(95, 85 + ((fair - 3.50) / 1.00) * 10);
}

function fairPriceLabel(fair) {
    if (fair < 1.40) return "Short — near certainty";
    if (fair < 1.80) return "Odds-on favourite";
    if (fair < 2.20) return "Even money range — value zone peak";
    if (fair < 3.00) return "Slight underdog";
    if (fair < 4.00) return "Underdog";
    return "Longshot";
}

function buildVisPanel(probPct, confFloat, fairOdds, mktLabel) {
    const pbClass  = probBarClass(probPct);
    const cbClass  = confBarClass(confFloat);
    const cpct     = confPct(confFloat);
    const fpos     = fairPricePos(fairOdds);

    return `
    <div class="verdict-vis-panel">
        <div class="verdict-vis-title">Model Analysis</div>
        <div class="verdict-vis-grid">

            <div class="vis-block">
                <div class="vis-label-row">
                    <span class="vis-label">Outcome probability</span>
                    <span class="vis-value" style="color:${probPct>=55?'var(--neon)':probPct>=40?'var(--gold)':'var(--away)'};">${probPct}%</span>
                </div>
                <div class="vis-bar-track">
                    <div class="vis-bar-fill ${pbClass}" style="width:${probPct}%"></div>
                </div>
                <div class="vis-desc">${probDesc(probPct)}</div>
            </div>

            <div class="vis-block">
                <div class="vis-label-row">
                    <span class="vis-label">Model confidence</span>
                    <span class="vis-value" style="color:${cpct>=50?'var(--neon)':cpct>=25?'var(--gold)':'var(--dim)'};">${cpct}%</span>
                </div>
                <div class="vis-bar-track">
                    <div class="vis-bar-fill ${cbClass}" style="width:${cpct}%"></div>
                </div>
                <div class="vis-desc">${confDesc(confFloat)}</div>
            </div>

        </div>

        <div class="vis-block" style="margin-top:12px;padding-top:12px;border-top:1px solid #1a1d28;">
            <div class="vis-label-row">
                <span class="vis-label">Fair price context — ${mktLabel}</span>
                <span class="vis-value" style="color:var(--neon);">${fairOdds}</span>
            </div>
            <div class="fair-context">
                <span class="fc-label">Short</span>
                <div class="fc-track">
                    <div class="fc-marker" style="left:${fpos}%"></div>
                </div>
                <span class="fc-label">Long</span>
            </div>
            <div class="vis-desc" style="margin-top:4px;">${fairPriceLabel(fairOdds)} — ${fpos > 20 && fpos < 80 ? 'within the value zone where bookmaker errors are most common' : fpos <= 20 ? 'bookmakers price short-odds markets very accurately — edge is rare' : 'longshot territory — high variance, edge harder to realise'}</div>
        </div>
    </div>`;
}

function buildValueThresholdHtml(fairOdds, bookieOdds) {
    if (!bookieOdds || bookieOdds <= 1) return "";
    const edge    = (bookieOdds / fairOdds) - 1;
    const edgePct = (edge * 100).toFixed(1);
    const barW    = Math.min(100, Math.abs(edge) * 500);
    const cls     = edge > 0.05 ? "pos" : edge > 0 ? "thin" : "neg";
    const label   = edge > 0.05 ? `+${edgePct}% VALUE` : edge > 0 ? "Thin" : `${edgePct}%`;
    return `<div class="value-threshold-row">
        <div class="vt-track"><div class="vt-fill ${cls}" style="width:${barW}%"></div></div>
        <span class="vt-label ${cls}">${label}</span>
    </div>`;
}
    if (!suggestions || !suggestions.length) {
        return `<div class="no-value-panel">
            — No standout markets identified for this fixture.<br>
            <span style="font-size:0.62rem;">All markets appear efficiently priced or outside the value zone. Enter bookie odds below to check manually.</span>
        </div>`;
    }

    const typeColors = {
        "AH":    { bg: "rgba(255,152,0,0.12)",    color: "#ff9800",  border: "rgba(255,152,0,0.3)"    },
        "Goals": { bg: "rgba(255,204,0,0.12)",    color: "var(--gold)", border: "rgba(255,204,0,0.3)" },
        "Draw":  { bg: "rgba(136,146,176,0.15)",  color: "var(--draw)", border: "rgba(136,146,176,0.3)" },
        "Home":  { bg: "rgba(0,255,157,0.12)",    color: "var(--neon)", border: "rgba(0,255,157,0.3)"  },
        "Away":  { bg: "rgba(255,51,102,0.12)",   color: "var(--away)", border: "rgba(255,51,102,0.3)" },
        "DC":    { bg: "rgba(79,195,247,0.12)",   color: "#4fc3f7",   border: "rgba(79,195,247,0.3)"  },
    };

    const rows = suggestions.map((s, i) => {
        const tc  = typeColors[s.type] || typeColors["Home"];
        const badgeStyle = `background:${tc.bg};color:${tc.color};border:1px solid ${tc.border};`;
        const rankLabel  = i === 0 ? "★ Top pick" : i === 1 ? "2nd" : "3rd";

        return `
        <div class="suggested-item">
            <div class="suggested-left">
                <div class="suggested-mkt-name">
                    ${s.label}
                    <span class="suggested-type-badge" style="${badgeStyle}">${s.type}</span>
                </div>
                <div class="suggested-instruction">
                    Check this at your bookie — if they offer <b>above ${s.fair}</b>, there is value
                </div>
            </div>
            <div class="suggested-right">
                <div class="suggested-fair">${s.fair}</div>
                <div class="suggested-prob">${s.prob}% model prob</div>
            </div>
        </div>`;
    }).join("");

    return `
    <div class="suggested-panel">
        <div class="suggested-title">
            📍 Markets Worth Checking at Your Bookie
        </div>
        ${rows}
    </div>`;
}

async function predict() {
    const idx = selectedIndex;
    const out = document.getElementById("output");
    if (idx === null || idx === undefined) return;

    out.innerHTML = "<div class='loader'></div>";

    try {
        const res = await fetch(`${API}/predict`, {
            method: "POST", headers: {"Content-Type":"application/json"},
            body: JSON.stringify(fixturesData[idx])
        });
        if (!res.ok) { out.innerHTML = `<div class="error-msg">⚡ Prediction engine offline (${res.status}). Try again.</div>`; return; }
        const d = await res.json();
        if (d.error) { out.innerHTML = `<div class="error-msg">⚡ ${d.error}</div>`; return; }

        const m      = fixturesData[idx];
        const market = d.market || {};

        const mkRow = (label, fairKey, kellyId, mktType) => {
            const fairVal = market[fairKey];
            const badge   = mktType ? `<span class="mkt-badge mkt-${mktType}"></span>` : "";
            return `
            <tr class="market-row-tr" id="row-${kellyId}">
                <td>${label}</td>
                <td class="fair-price">${fairVal || "--"}</td>
                <td>
                    <input type="number" class="bookie-input" placeholder="Odds"
                        step="0.01" min="1.01" inputmode="decimal"
                        data-fair="${fairVal || 0}" data-kelly="${kellyId}"
                        oninput="calcKelly(this, ${fairVal || 0}, '${kellyId}')">
                </td>
                <td class="kelly-result" id="${kellyId}"><span class="no-value">--</span></td>
            </tr>`;
        };

        // Compute confidence from probs for vis panel
        const probs    = [d.probs.home, d.probs.draw, d.probs.away].sort((a,b)=>b-a);
        const confGap  = (probs[0] - probs[1]) / 100;
        const topProb  = probs[0];
        const topLabel = d.probs.home >= d.probs.away && d.probs.home >= d.probs.draw
            ? `${m.home} Win`
            : d.probs.away >= d.probs.home && d.probs.away >= d.probs.draw
            ? `${m.away} Win` : "Draw";
        const topFair  = d.probs.home >= d.probs.away && d.probs.home >= d.probs.draw
            ? market.home
            : d.probs.away >= d.probs.home && d.probs.away >= d.probs.draw
            ? market.away : market.draw;

        const h_w  = d.probs.home > d.probs.away;
        const fav  = h_w ? m.home : m.away;
        const conf = Math.max(d.probs.home, d.probs.away);
        const btts_pct = market.btts   ? Math.round((1/market.btts)*100) : "?";
        const o25_pct  = market.over25 ? Math.round((1/market.over25)*100) : "?";

        const verdict = `
            Projected scoreline: <b>${d.score}</b>.
            ${fav} are favoured at <b>${conf}%</b> win probability.
            BTTS probability: <b>${btts_pct}%</b>.
            Over 2.5 goals probability: <b>${o25_pct}%</b>.
            Enter your bookie's odds in the table above to detect value and calculate ¼-Kelly stakes.
        `.trim();

        out.innerHTML = `
        <div class="card">
            <div class="teams-row">
                <div class="team-block">
                    <b>${m.home}</b><small>Rank #${d.h_rank}</small>
                    ${renderForm(d.h_form,"left","Last 5 Home")}
                </div>
                <div class="team-block right">
                    <b>${m.away}</b><small>Rank #${d.a_rank}</small>
                    ${renderForm(d.a_form,"right","Last 5 Away")}
                </div>
            </div>

            <div class="score">${d.score}</div>
            <div class="lambda-row">
                <span>λ HOME ${d.h_lam}</span>
                <span>⚪ POISSON</span>
                <span>λ AWAY ${d.a_lam}</span>
            </div>

            <div class="prob-bar">
                <div class="p-h" style="width:${d.probs.home}%">${d.probs.home}%</div>
                <div class="p-d" style="width:${d.probs.draw}%">${d.probs.draw}%</div>
                <div class="p-a" style="width:${d.probs.away}%">${d.probs.away}%</div>
            </div>

            ${buildVisPanel(topProb, confGap, topFair || 2.00, topLabel)}

            ${buildSuggestedMarketsHtml(d.suggested_markets || [], m)}

            <div class="section-label">Fair Odds · Enter Bookie Price to Check Value · ¼ Kelly Staker</div>

            <div class="bankroll-row">
                <label>Bankroll</label>
                <span class="bankroll-symbol">€</span>
                <input type="number" id="bankroll-input" value="1000" min="1" step="1"
                    inputmode="decimal" placeholder="1000" oninput="refreshKellyStakes()">
            </div>

            <table class="market-table">
                <thead><tr>
                    <th>Market</th><th>Fair Odds</th><th>Your Bookie</th><th>Value / Stake</th>
                </tr></thead>
                <tbody>
                    ${mkRow("Home Win",     "home",    "k-h",    "1X2")}
                    ${mkRow("Draw",         "draw",    "k-d",    "1X2")}
                    ${mkRow("Away Win",     "away",    "k-a",    "1X2")}
                    ${mkRow("1X Home/Draw", "dc_1x",   "k-dc1x", "DC")}
                    ${mkRow("X2 Draw/Away", "dc_x2",   "k-dcx2", "DC")}
                    ${mkRow("12 Home/Away", "dc_12",   "k-dc12", "DC")}
                    ${mkRow("BTTS",         "btts",    "k-btts", "Goals")}
                    ${mkRow("Over 1.5",     "over15",  "k-o15",  "Goals")}
                    ${mkRow("Over 2.5",     "over25",  "k-o25",  "Goals")}
                    ${mkRow("Over 3.5",     "over35",  "k-o35",  "Goals")}
                    ${mkRow("AH Home -0.5", "ah_hm05", "k-ahm05","AH")}
                    ${mkRow("AH Home +0.5", "ah_hp05", "k-ahp05","AH")}
                    ${mkRow("AH Home -1.5", "ah_hm15", "k-ahm15","AH")}
                    ${mkRow("AH Home +1.5", "ah_hp15", "k-ahp15","AH")}
                </tbody>
            </table>

            <div class="gaffer-box">
                ${verdict}
                <div class="signature">— THE GAFFER</div>
            </div>
        </div>`;

    } catch(e) {
        out.innerHTML = `<div class="error-msg">⚡ Connection lost. Check your link and retry.</div>`;
    }
}
