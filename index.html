<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE GAFFER | Tactical Intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
    :root {
        --neon:   #00ff9d;
        --bg:     #0a0b10;
        --card:   #151821;
        --border: #2a2d3a;
        --away:   #ff3366;
        --draw:   #8892b0;
        --dim:    #4a5060;
        --gold:   #ffcc00;
    }

    * { box-sizing: border-box; }

    body {
        background: var(--bg); color: #fff;
        font-family: Inter, sans-serif;
        display: flex; justify-content: center;
        padding: 20px; min-height: 100vh;
    }

    .container { width: 100%; max-width: 480px; }

    h1 { font-family: Orbitron, sans-serif; color: var(--neon); text-align: center; letter-spacing: 5px; font-size: 1.2rem; margin-bottom: 6px; }
    .tagline { text-align: center; font-size: 0.65rem; color: var(--dim); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 24px; }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 20px; }

    input[type="date"] {
        width: 100%; padding: 14px; margin-bottom: 12px;
        border-radius: 10px; background: #000;
        border: 1px solid var(--border); color: #fff;
        font-family: Inter, sans-serif; font-size: 0.9rem;
    }
    input[type="date"]:focus { outline: 1px solid var(--neon); }

    button {
        width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 10px;
        background: var(--neon); color: #000; font-weight: 800;
        font-family: Orbitron, sans-serif; font-size: 0.75rem; letter-spacing: 2px;
        cursor: pointer; border: none; transition: box-shadow 0.2s;
    }
    button:hover:not(:disabled) { box-shadow: 0 0 18px rgba(0,255,157,0.35); }
    button:disabled { background: #1a1a1a; color: #444; cursor: not-allowed; box-shadow: none; }

    /* ── Custom fixture dropdown ── */
    .fix-wrap { position: relative; margin-bottom: 12px; }

    .fix-toggle {
        width: 100%; display: flex; align-items: center; justify-content: space-between;
        background: #000; border: 1px solid var(--border); border-radius: 10px;
        padding: 12px 14px; cursor: pointer; user-select: none;
        transition: border-color 0.2s;
    }
    .fix-toggle:hover { border-color: rgba(0,255,157,0.4); }
    .fix-toggle.open  { border-color: var(--neon); border-radius: 10px 10px 0 0; border-bottom-color: transparent; }

    .fix-toggle-left { display: flex; flex-direction: column; gap: 3px; }
    .fix-toggle-title { font-family: Orbitron, sans-serif; font-size: 0.72rem; font-weight: 700; color: var(--neon); }
    .fix-toggle-sub   { font-size: 0.6rem; color: var(--dim); }
    .fix-chevron { font-size: 0.7rem; color: var(--dim); transition: transform 0.25s; }
    .fix-toggle.open .fix-chevron { transform: rotate(180deg); color: var(--neon); }

    .fix-panel {
        position: absolute; top: 100%; left: 0; right: 0;
        background: #000; border: 1px solid var(--neon); border-top: none;
        border-radius: 0 0 10px 10px;
        max-height: 0; overflow: hidden;
        transition: max-height 0.3s ease;
        z-index: 100;
    }
    .fix-panel.open { max-height: 400px; overflow-y: auto; }

    .fix-group-label {
        padding: 8px 14px 4px;
        font-size: 0.58rem; letter-spacing: 2px;
        color: var(--dim); text-transform: uppercase;
        border-top: 1px solid #1a1d28;
    }
    .fix-group-label:first-child { border-top: none; }

    .fix-item {
        display: flex; align-items: center; gap: 10px;
        padding: 11px 14px; cursor: pointer;
        border-top: 1px solid #0d0f16;
        transition: background 0.15s;
    }
    .fix-item:hover    { background: #111318; }
    .fix-item.selected { background: rgba(0,255,157,0.06); border-left: 2px solid var(--neon); }

    .fix-dot  { font-size: 0.85rem; flex-shrink: 0; }
    .fix-time { font-family: Orbitron, sans-serif; font-size: 0.6rem; color: var(--dim); flex-shrink: 0; min-width: 38px; }
    .fix-name { font-size: 0.8rem; color: #dde; flex: 1; min-width: 0; }

    /* ── Status message ── */
    .status-msg { text-align: center; font-size: 0.75rem; color: var(--dim); padding: 10px 0; }
    .error-msg  { text-align: center; font-size: 0.78rem; color: var(--away); padding: 10px 0; }

    /* GET VERDICT pulse */
    @keyframes btn-pulse {
        0%   { box-shadow: 0 0 0 0 rgba(0,255,157,0.7); }
        70%  { box-shadow: 0 0 0 12px rgba(0,255,157,0); }
        100% { box-shadow: 0 0 0 0 rgba(0,255,157,0); }
    }
    .btn-pulse { animation: btn-pulse 0.8s ease 0s 2; }

    /* ── Bankroll row ── */
    .bankroll-row {
        display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
        background: #000; border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px;
    }
    .bankroll-row label { font-size: 0.65rem; letter-spacing: 2px; color: var(--dim); text-transform: uppercase; white-space: nowrap; flex-shrink: 0; }
    .bankroll-symbol { font-family: Orbitron, sans-serif; font-size: 0.85rem; color: var(--neon); flex-shrink: 0; }
    #bankroll-input { flex: 1; background: transparent; border: none; color: var(--neon); font-family: Orbitron, sans-serif; font-size: 0.85rem; outline: none; min-width: 0; }
    #bankroll-input::-webkit-inner-spin-button { -webkit-appearance: none; }

    /* ── Score ── */
    .score { font-family: Orbitron, sans-serif; font-size: 4rem; font-weight: 900; text-align: center; color: var(--neon); margin: 12px 0 4px; text-shadow: 0 0 24px rgba(0,255,157,0.4); }
    .lambda-row { display: flex; justify-content: center; gap: 20px; font-size: 0.65rem; color: var(--dim); letter-spacing: 1px; margin-bottom: 4px; }

    /* ── Prob bar ── */
    .prob-bar { display: flex; height: 24px; border-radius: 6px; overflow: hidden; margin: 16px 0; font-family: Orbitron, sans-serif; font-size: 0.65rem; line-height: 24px; text-align: center; }
    .p-h { background: var(--neon); color: #000; min-width: 28px; }
    .p-d { background: var(--draw); color: #000; min-width: 28px; }
    .p-a { background: var(--away); color: #000; min-width: 28px; }

    /* ── Form dots ── */
    .form-row { display: flex; gap: 3px; margin-top: 4px; flex-wrap: wrap; }
    .dot { width: 20px; height: 20px; border-radius: 4px; font-size: 10px; line-height: 20px; text-align: center; color: #000; font-weight: 700; display: inline-block; }
    .W { background: var(--neon); } .D { background: var(--draw); } .L { background: var(--away); } .Q { background: #2a2d3a; color: #556; border: 1px solid #333; }
    .form-venue-label { font-size: 0.58rem; letter-spacing: 2px; color: var(--dim); text-transform: uppercase; margin-top: 6px; margin-bottom: 2px; }
    .teams-row { display: flex; justify-content: space-between; align-items: flex-start; font-size: 0.82rem; margin-bottom: 4px; }
    .team-block { width: 48%; } .team-block.right { text-align: right; }
    .team-block b { font-size: 0.9rem; display: block; margin-bottom: 2px; }
    .team-block small { color: var(--dim); font-size: 0.7rem; }
    .team-block .form-row.right { justify-content: flex-end; }
    .team-block.right .form-venue-label { text-align: right; }

    .section-label { font-size: 0.6rem; letter-spacing: 3px; color: var(--dim); text-transform: uppercase; margin: 16px 0 8px; border-top: 1px solid #1a1d28; padding-top: 12px; }

    /* ── Market table ── */
    .market-table { width: 100%; border-collapse: collapse; }
    .market-table th { font-size: 0.6rem; letter-spacing: 2px; color: var(--dim); text-transform: uppercase; padding: 4px 0 8px; text-align: left; font-weight: 400; }
    .market-table th:last-child, .market-table td:last-child { text-align: right; }
    .market-row-tr { border-top: 1px solid #1a1d28; }
    .market-row-tr td { padding: 10px 4px; font-size: 0.8rem; vertical-align: middle; }
    .fair-price { font-family: Orbitron, sans-serif; font-size: 0.75rem; color: var(--neon); }
    .bookie-input { width: 72px; padding: 7px 8px; border-radius: 7px; background: #000; border: 1px solid var(--border); color: #fff; font-family: Orbitron, sans-serif; font-size: 0.72rem; text-align: center; }
    .bookie-input:focus { outline: none; border-color: var(--neon); }
    .kelly-result { font-family: Orbitron, sans-serif; font-size: 0.72rem; color: var(--dim); min-width: 80px; text-align: right; }
    .market-row-tr.value { background: rgba(0,255,157,0.05); }
    .market-row-tr.value td:first-child { border-left: 2px solid var(--neon); padding-left: 8px; }
    .prime { color: var(--neon); font-weight: 700; animation: pulse-text 2s ease-in-out infinite; }
    @keyframes pulse-text { 0%,100%{opacity:1;} 50%{opacity:0.6;} }
    .no-value  { color: #3a3f50; }
    .thin-edge { color: var(--draw); font-size: 0.65rem; }

    /* Market type badges */
    .mkt-badge { display: inline-block; font-family: Orbitron, sans-serif; font-size: 0.52rem; font-weight: 700; letter-spacing: 1px; padding: 2px 6px; border-radius: 4px; margin-left: 4px; vertical-align: middle; }
    .mkt-1X2   { background: rgba(0,255,157,0.12);  color: var(--neon); border: 1px solid rgba(0,255,157,0.25); }
    .mkt-DC    { background: rgba(79,195,247,0.12); color: #4fc3f7;     border: 1px solid rgba(79,195,247,0.25); }
    .mkt-AH    { background: rgba(255,152,0,0.12);  color: #ff9800;     border: 1px solid rgba(255,152,0,0.25); }
    .mkt-Goals { background: rgba(255,204,0,0.12);  color: var(--gold); border: 1px solid rgba(255,204,0,0.25); }

    /* ── Model Analysis panel ── */
    .vis-panel { background: #0d0f16; border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin: 14px 0; }
    .vis-title  { font-size: 0.6rem; letter-spacing: 3px; color: var(--dim); text-transform: uppercase; margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid #1a1d28; }
    .vis-grid   { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .vis-block  { margin-bottom: 0; }
    .vis-row    { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .vis-label  { font-size: 0.58rem; letter-spacing: 1px; color: var(--dim); text-transform: uppercase; }
    .vis-val    { font-family: Orbitron, sans-serif; font-size: 0.7rem; font-weight: 700; }
    .vis-track  { height: 7px; background: #1a1d28; border-radius: 4px; overflow: hidden; margin-bottom: 3px; }
    .vis-fill   { height: 100%; border-radius: 4px; transition: width 0.5s ease; }
    .vis-desc   { font-size: 0.58rem; color: var(--dim); line-height: 1.4; }
    .bar-h { background: var(--neon); box-shadow: 0 0 6px rgba(0,255,157,0.4); }
    .bar-m { background: var(--gold); }
    .bar-l { background: #555; }

    .fc-row    { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
    .fc-track  { flex: 1; height: 6px; background: linear-gradient(to right,#1a1d28 0%,rgba(0,255,157,0.3) 30%,rgba(0,255,157,0.6) 55%,rgba(255,204,0,0.4) 75%,#1a1d28 100%); border-radius: 3px; position: relative; }
    .fc-pin    { position: absolute; top: -3px; width: 4px; height: 12px; background: #fff; border-radius: 2px; transform: translateX(-50%); box-shadow: 0 0 4px rgba(255,255,255,0.6); }
    .fc-label  { font-size: 0.56rem; color: var(--dim); white-space: nowrap; }

    /* ── Suggested markets panel ── */
    .sug-panel { background: rgba(0,255,157,0.04); border: 1px solid rgba(0,255,157,0.2); border-radius: 12px; padding: 14px 16px; margin: 14px 0; }
    .sug-title { font-family: Orbitron, sans-serif; font-size: 0.6rem; letter-spacing: 2px; color: var(--neon); text-transform: uppercase; margin-bottom: 12px; }
    .sug-item  { display: flex; align-items: center; justify-content: space-between; padding: 9px 0; border-top: 1px solid rgba(0,255,157,0.08); }
    .sug-item:first-of-type { border-top: none; }
    .sug-left  { flex: 1; min-width: 0; }
    .sug-name  { font-size: 0.82rem; font-weight: 600; color: #dde; margin-bottom: 3px; }
    .sug-inst  { font-size: 0.62rem; color: var(--dim); line-height: 1.4; }
    .sug-right { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; flex-shrink: 0; margin-left: 12px; }
    .sug-fair  { font-family: Orbitron, sans-serif; font-size: 0.85rem; font-weight: 700; color: var(--neon); }
    .sug-prob  { font-family: Orbitron, sans-serif; font-size: 0.6rem; color: var(--dim); }
    .sug-type  { font-family: Orbitron, sans-serif; font-size: 0.48rem; font-weight: 700; letter-spacing: 1px; padding: 2px 5px; border-radius: 3px; }
    .no-sug    { background: rgba(136,146,176,0.06); border: 1px solid rgba(136,146,176,0.15); border-radius: 12px; padding: 12px 16px; margin: 14px 0; font-size: 0.72rem; color: var(--draw); text-align: center; line-height: 1.5; }

    /* ── Value threshold ── */
    .vt-row   { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
    .vt-track { flex: 1; height: 5px; background: #1a1d28; border-radius: 3px; overflow: hidden; }
    .vt-fill  { height: 100%; border-radius: 3px; transition: width 0.4s; }
    .vt-pos   { background: var(--neon); } .vt-thin { background: var(--gold); } .vt-neg { background: var(--away); }
    .vt-lbl   { font-family: Orbitron, sans-serif; font-size: 0.58rem; min-width: 48px; text-align: right; }
    .vt-lbl.pos { color: var(--neon); } .vt-lbl.thin { color: var(--gold); } .vt-lbl.neg { color: var(--away); }

    .gaffer-box { background: rgba(0,255,157,0.04); border-left: 3px solid var(--neon); border-radius: 0 8px 8px 0; padding: 14px 16px; margin-top: 16px; font-size: 0.82rem; line-height: 1.65; color: #b0bcc8; }
    .gaffer-box .signature { font-family: Orbitron, sans-serif; color: var(--neon); font-size: 0.65rem; letter-spacing: 3px; text-align: right; margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(0,255,157,0.1); }

    .loader { border: 3px solid #1a1d28; border-top: 3px solid var(--neon); border-radius: 50%; width: 32px; height: 32px; margin: 20px auto; animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Hamburger menu ── */
    .menu-btn {
        position: fixed; top: 16px; right: 16px; z-index: 999;
        width: 38px; height: 38px; border-radius: 8px;
        background: #151821; border: 1px solid var(--border);
        display: flex; align-items: center; justify-content: center;
        cursor: pointer; font-size: 1rem; color: var(--dim);
        opacity: 0; pointer-events: none; transition: opacity 0.3s, border-color 0.2s;
    }
    .menu-btn.ready { opacity: 1; pointer-events: all; }
    .menu-btn.ready:hover { border-color: var(--neon); color: var(--neon); }

    .menu-dropdown {
        position: fixed; top: 62px; right: 16px; z-index: 998;
        background: #151821; border: 1px solid var(--border);
        border-radius: 12px; padding: 6px; min-width: 190px;
        display: none; flex-direction: column; gap: 2px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    }
    .menu-dropdown.open { display: flex; }

    .menu-item {
        display: flex; align-items: center; gap: 10px;
        padding: 10px 12px; border-radius: 8px; cursor: pointer;
        font-family: monospace; font-size: 0.65rem; letter-spacing: 1px;
        transition: background 0.15s; border: none; background: transparent;
        width: 100%; text-align: left;
    }
    .menu-item:hover { background: rgba(255,255,255,0.04); }
    .menu-item .mi   { font-size: 0.85rem; width: 18px; text-align: center; }</style>
</head>
<body>

<!-- Context-aware hamburger menu — only activates after verdict loads -->
<div class="menu-btn" id="menu-btn" onclick="toggleMenu()">≡</div>
<div class="menu-dropdown" id="menu-dropdown">
    <button class="menu-item" style="color:var(--neon);"  onclick="menuLogBet()">   <span class="mi">📊</span> LOG BET</button>
    <button class="menu-item" style="color:var(--draw);"  onclick="menuDownload()"> <span class="mi">⬇</span> DOWNLOAD</button>
    <button class="menu-item" style="color:var(--gold);"  onclick="menuAiPrompt()"> <span class="mi">🤖</span> AI PROMPT</button>
    <div style="border-top:1px solid #1a1d28;margin:4px 0;"></div>
    <button class="menu-item" style="color:var(--dim);"   onclick="window.location.href='log.html'">
        <span class="mi">📋</span> VIEW LOG
    </button>
</div>

<div class="container">

    <h1>THE GAFFER</h1>
    <p class="tagline">Tactical Intelligence · Poisson Engine</p>

    <div class="card">
        <input type="date" id="date">
        <button onclick="getFixtures()">SCAN TACTICAL BOARD</button>

        <!-- Custom fixture picker -->
        <div class="fix-wrap" id="fix-wrap" style="display:none;">
            <div class="fix-toggle" id="fix-toggle" onclick="toggleFixtures()">
                <div class="fix-toggle-left">
                    <div class="fix-toggle-title" id="fix-title">Select a fixture</div>
                    <div class="fix-toggle-sub"  id="fix-sub">Tap to open</div>
                </div>
                <div class="fix-chevron">▼</div>
            </div>
            <div class="fix-panel" id="fix-panel"></div>
        </div>

        <div id="fix-status"></div>

        <button id="btn" onclick="predict()" disabled>GET VERDICT</button>
        <button onclick="window.location.href='acca.html'" style="background:#000;color:var(--neon);border:1px solid var(--neon);margin-bottom:0;">⚡ ACCA BUILDER</button>
        <button onclick="window.location.href='session.html'" style="background:#000;color:#ffcc00;border:1px solid #ffcc00;margin-top:12px;margin-bottom:0;">🎯 MASANIELLO</button>
    </div>

    <div id="output"></div>

</div>
<script>
const API = "https://football-api-9e4p.onrender.com";
let fixturesData  = [];
let selectedIndex = null;
let currentVerdict = null;  // stores last predict() response for menu actions

// ── Server wake-up ──
async function keepAlive() {
    try { await fetch(API + "/ping"); } catch(e) {}
}
keepAlive();
document.getElementById("date").value = new Date().toISOString().split("T")[0];

// ── Menu ──
function toggleMenu() {
    document.getElementById("menu-dropdown").classList.toggle("open");
}
document.addEventListener("click", function(e) {
    var btn = document.getElementById("menu-btn");
    var dd  = document.getElementById("menu-dropdown");
    if (!btn.contains(e.target) && !dd.contains(e.target)) {
        dd.classList.remove("open");
    }
});

function activateMenu() {
    document.getElementById("menu-btn").classList.add("ready");
}

function menuLogBet() {
    document.getElementById("menu-dropdown").classList.remove("open");
    if (!currentVerdict) return;
    var m = fixturesData[selectedIndex] || {};
    // Find first value market from table
    var valueRow = document.querySelector(".market-row-tr.value");
    var market = "—"; var bookie = null; var stake = null; var edge = null;
    if (valueRow) {
        market = valueRow.querySelector("td") ? valueRow.querySelector("td").textContent : "—";
        var inp = valueRow.querySelector(".bookie-input");
        if (inp) bookie = inp.value;
        var stakeEl = valueRow.querySelector(".prime");
        if (stakeEl) stake = stakeEl.textContent.replace("★ €","").trim();
        var edgeEl = valueRow.querySelector(".vt-lbl.pos");
        if (edgeEl) edge = edgeEl.textContent;
    }
    var bankroll = getBankroll();
    var payload = {
        match_key:   currentVerdict.match_key,
        home:        m.home, away: m.away,
        comp:        m.comp, date: (m.kickoff||"").split("T")[0]||m.date,
        market:      market, bookie_odds: bookie,
        stake:       stake,  edge: edge, bankroll: bankroll,
    };
    fetch(API + "/log/bet", {
        method: "POST", headers: {"Content-Type":"application/json"},
        body: JSON.stringify(payload)
    }).then(function(r) { return r.json(); }).then(function() {
        var btn = document.getElementById("menu-btn");
        var orig = btn.textContent;
        btn.textContent = "✓"; btn.style.color = "var(--neon)";
        setTimeout(function() { btn.textContent = orig; btn.style.color = ""; }, 2000);
    }).catch(function() {});
}

function menuDownload() {
    document.getElementById("menu-dropdown").classList.remove("open");
    if (!currentVerdict) return;
    var m = fixturesData[selectedIndex] || {};
    var data = Object.assign({}, currentVerdict, {
        home: m.home, away: m.away, comp: m.comp,
        league: m.league, kickoff: m.kickoff,
        exported_at: new Date().toISOString(),
    });
    var blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
    var url  = URL.createObjectURL(blob);
    var a    = document.createElement("a");
    a.href   = url;
    a.download = (m.home||"fixture").replace(/\s/g,"_") + "_vs_" + (m.away||"away").replace(/\s/g,"_") + ".json";
    a.click();
    URL.revokeObjectURL(url);
}

function menuAiPrompt() {
    document.getElementById("menu-dropdown").classList.remove("open");
    if (!currentVerdict) return;

    var d   = currentVerdict;
    var m   = d._fixture || fixturesData[selectedIndex] || {};
    var mkt = d._market  || d.market || {};
    var vis = d._vis     || {};
    var p   = d.probs    || {};

    // Suggested markets
    var sug = (d.suggested_markets || []).map(function(s) {
        return "  - " + s.label + " · Fair " + s.fair + " · " + s.prob + "% model prob";
    }).join("\n");

    // All fair odds
    var allFair =
        "  1X2:\n" +
        "    Home Win:     " + (mkt.home    || "--") + "\n" +
        "    Draw:         " + (mkt.draw    || "--") + "\n" +
        "    Away Win:     " + (mkt.away    || "--") + "\n" +
        "  Double Chance:\n" +
        "    1X:           " + (mkt.dc_1x   || "--") + "\n" +

// ── Custom dropdown ──
function toggleFixtures() {
    const toggle = document.getElementById("fix-toggle");
    const panel  = document.getElementById("fix-panel");
    const isOpen = toggle.classList.contains("open");
    toggle.classList.toggle("open", !isOpen);
    panel.classList.toggle("open", !isOpen);
}

function closeFixtures() {
    document.getElementById("fix-toggle").classList.remove("open");
    document.getElementById("fix-panel").classList.remove("open");
}

function selectFixture(idx) {
    selectedIndex = idx;
    const m = fixturesData[idx];

    // Update toggle display
    const dot = m.tier === "HIGH" ? "🟢" : m.tier === "MED" ? "🟡" : "⚪";
    document.getElementById("fix-title").textContent = m.home + " vs " + m.away;
    document.getElementById("fix-sub").textContent   = dot + "  " + m.league;

    // Highlight selected item
    document.querySelectorAll(".fix-item").forEach(el => {
        el.classList.toggle("selected", parseInt(el.dataset.idx) === idx);
    });

    // Enable GET VERDICT with pulse
    const btn = document.getElementById("btn");
    btn.disabled = false;
    btn.classList.remove("btn-pulse");
    void btn.offsetWidth;
    btn.classList.add("btn-pulse");

    document.getElementById("output").innerHTML = "";
    closeFixtures();
}

function buildFixturePanel(fixtures) {
    // Group by league
    const groups = {};
    fixtures.forEach((m, i) => {
        const league = m.league || m.comp || "Other";
        if (!groups[league]) groups[league] = [];
        groups[league].push({ m, i });
    });

    // Sort within group by kickoff
    Object.values(groups).forEach(arr => {
        arr.sort((a, b) => (a.m.kickoff || a.m.date) < (b.m.kickoff || b.m.date) ? -1 : 1);
    });

    // Sort leagues by fixture count desc
    const leagues = Object.keys(groups).sort((a, b) => groups[b].length - groups[a].length);

    const panel = document.getElementById("fix-panel");
    panel.innerHTML = "";

    leagues.forEach(league => {
        const lbl = document.createElement("div");
        lbl.className = "fix-group-label";
        lbl.textContent = league;
        panel.appendChild(lbl);

        groups[league].forEach(({ m, i }) => {
            const dot = m.tier === "HIGH" ? "🟢" : m.tier === "MED" ? "🟡" : "⚪";
            let timeStr = "";
            if (m.kickoff && m.kickoff.length > 10) {
                try { timeStr = new Date(m.kickoff).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); }
                catch(e) {}
            }

            const item = document.createElement("div");
            item.className = "fix-item";
            item.dataset.idx = i;
            item.onclick = () => selectFixture(i);
            item.innerHTML =
                '<span class="fix-dot">' + dot + '</span>' +
                (timeStr ? '<span class="fix-time">' + timeStr + '</span>' : '') +
                '<span class="fix-name">' + m.home + ' vs ' + m.away + '</span>';

            panel.appendChild(item);
        });
    });
}

// ── Scan fixtures ──
async function getFixtures(attempt) {
    attempt = attempt || 1;
    const MAX = 4; const DELAY = 4000;
    const d   = document.getElementById("date").value;
    if (!d) return;

    selectedIndex = null;
    document.getElementById("btn").disabled = true;
    document.getElementById("fix-wrap").style.display = "none";
    document.getElementById("output").innerHTML = "";

    const status = document.getElementById("fix-status");
    status.innerHTML = '<div class="status-msg"><div class="loader" style="width:20px;height:20px;margin:6px auto;border-width:2px;"></div>' +
        (attempt === 1 ? "Scanning fixtures..." : "Server warming up... (attempt " + attempt + "/" + MAX + ")") + "</div>";

    try {
        const res  = await fetch(API + "/scan?date_from=" + d + "&date_to=" + d);
        const data = await res.json();

        if (data.status === "loading") {
            if (attempt < MAX) {
                status.innerHTML = '<div class="status-msg">Syncing... retrying in ' + (DELAY/1000) + 's</div>';
                setTimeout(function() { getFixtures(attempt + 1); }, DELAY);
                return;
            }
            status.innerHTML = '<div class="status-msg">📋 Still syncing — try again shortly.</div>';
            return;
        }
        if (data.error) {
            if (attempt < MAX) { setTimeout(function() { getFixtures(attempt + 1); }, DELAY); return; }
            status.innerHTML = '<div class="error-msg">⚡ ' + data.error + '</div>';
            return;
        }
        if (data.status === "no_games") {
            status.innerHTML = '<div class="status-msg">📋 No matches scheduled for this date.</div>';
            return;
        }

        fixturesData = Array.isArray(data) ? data : [];
        if (!fixturesData.length) {
            status.innerHTML = '<div class="status-msg">No matches found.</div>';
            return;
        }

        // Build panel and show
        buildFixturePanel(fixturesData);
        const counts = { HIGH: 0, MED: 0, LOW: 0 };
        fixturesData.forEach(function(m) { counts[m.tier] = (counts[m.tier] || 0) + 1; });
        document.getElementById("fix-title").textContent = fixturesData.length + " fixture" + (fixturesData.length !== 1 ? "s" : "") + " found";
        document.getElementById("fix-sub").textContent   = "🟢 " + (counts.HIGH||0) + "  🟡 " + (counts.MED||0) + "  ⚪ " + (counts.LOW||0) + "  — tap to select";

        const wrap = document.getElementById("fix-wrap");
        wrap.style.display = "block";

        // Auto-open panel
        document.getElementById("fix-toggle").classList.add("open");
        document.getElementById("fix-panel").classList.add("open");

        status.innerHTML = "";

    } catch(e) {
        if (attempt < MAX) {
            status.innerHTML = '<div class="status-msg">Server waking up... retrying in ' + (DELAY/1000) + 's</div>';
            setTimeout(function() { getFixtures(attempt + 1); }, DELAY);
            return;
        }
        status.innerHTML = '<div class="error-msg">⚡ Connection lost. Check your link and retry.</div>';
    }
}

// ── Helpers ──
function getBankroll() {
    var el = document.getElementById("bankroll-input");
    var val = el ? parseFloat(el.value) : 1000;
    return (!val || isNaN(val) || val <= 0) ? 1000 : val;
}

function refreshKellyStakes() {
    document.querySelectorAll(".bookie-input").forEach(function(input) {
        if (input.value) {
            var fair   = parseFloat(input.dataset.fair || "0");
            var kid    = input.dataset.kelly;
            if (fair && kid) calcKelly(input, fair, kid);
        }
    });
}

function renderForm(str, align, venueLabel) {
    align = align || "left";
    venueLabel = venueLabel || "";
    var justify = "justify-content:" + (align === "right" ? "flex-end" : "flex-start");
    var lbl = venueLabel ? '<div class="form-venue-label">' + venueLabel + '</div>' : "";
    if (!str || str === "???") {
        return lbl + '<div class="form-row" style="' + justify + '"><div class="dot Q">?</div><div class="dot Q">?</div><div class="dot Q">?</div></div>';
    }
    var dots = str.split("").map(function(c) {
        var cls = ["W","D","L"].includes(c) ? c : "Q";
        return '<div class="dot ' + cls + '">' + c + '</div>';
    }).join("");
    return lbl + '<div class="form-row" style="' + justify + '">' + dots + '</div>';
}

function calcKelly(inputEl, fairOdds, targetId) {
    var target   = document.getElementById(targetId);
    var row      = inputEl.closest(".market-row-tr");
    var val      = parseFloat(inputEl.value);
    var bankroll = getBankroll();
    row.classList.remove("value");
    if (!val || isNaN(val) || val <= 1.0 || !fairOdds || fairOdds <= 1) {
        target.innerHTML = '<span class="no-value">--</span>'; return;
    }
    var p = 1/fairOdds, q = 1-p, b = val-1;
    var fstar = (b*p-q)/b;
    var edge  = (val/fairOdds)-1;
    var edgePct = (edge*100).toFixed(1);
    var barW  = Math.min(100, Math.abs(edge)*500);

    if (edge <= 0) {
        target.innerHTML = '<div class="vt-row"><div class="vt-track"><div class="vt-fill vt-neg" style="width:' + barW + '%"></div></div><span class="vt-lbl neg">' + edgePct + '%</span></div>';
        return;
    }
    if (edge <= 0.05) {
        target.innerHTML = '<div class="vt-row"><div class="vt-track"><div class="vt-fill vt-thin" style="width:' + barW + '%"></div></div><span class="vt-lbl thin">Thin</span></div>';
        return;
    }
    if (fstar <= 0) { target.innerHTML = '<span class="no-value">No edge</span>'; return; }
    var stake = (0.25 * fstar * bankroll).toFixed(2);
    row.classList.add("value");
    target.innerHTML = '<div class="vt-row"><div class="vt-track"><div class="vt-fill vt-pos" style="width:' + Math.min(100,barW) + '%"></div></div><span class="vt-lbl pos">+' + edgePct + '%</span></div><span class="prime" style="display:block;font-size:0.7rem;text-align:right;margin-top:2px;">★ €' + stake + '</span>';
}

// ── Visualisation helpers ──
function probCls(p)  { return p >= 55 ? "bar-h" : p >= 40 ? "bar-m" : "bar-l"; }
function confCls(c)  { return c >= 0.25 ? "bar-h" : c >= 0.12 ? "bar-m" : "bar-l"; }
function confPct(c)  { return Math.min(100, Math.round((c / 0.50) * 100)); }
function fairPos(f)  {
    if (f <= 1.40) return 5;
    if (f <= 2.00) return 10 + ((f-1.40)/0.60)*30;
    if (f <= 2.50) return 40 + ((f-2.00)/0.50)*20;
    if (f <= 3.50) return 60 + ((f-2.50)/1.00)*25;
    return Math.min(95, 85 + ((f-3.50)/1.00)*10);
}
function fairLbl(f) {
    if (f < 1.40) return "Short — bookmakers price this accurately";
    if (f < 1.80) return "Odds-on favourite";
    if (f < 2.20) return "Even money range — value zone peak";
    if (f < 3.00) return "Slight underdog";
    if (f < 4.00) return "Underdog";
    return "Longshot — high variance";
}
function probDesc(p) {
    if (p >= 60) return "Strong model conviction";
    if (p >= 45) return "Genuine contest — neither side dominant";
    return "Lower probability — higher variance";
}
function confDesc(c) {
    if (c >= 0.25) return "Model clearly separates outcome from alternatives";
    if (c >= 0.12) return "Moderate separation — check top 2 markets";
    return "Closely contested — higher prediction uncertainty";
}

function buildVisPanel(prob, conf, fair, label) {
    var cp  = confPct(conf);
    var fp  = fairPos(fair);
    var pcl = probCls(prob);
    var ccl = confCls(conf);
    var pColor = prob >= 55 ? "var(--neon)" : prob >= 40 ? "var(--gold)" : "var(--away)";
    var cColor = cp >= 50 ? "var(--neon)" : cp >= 25 ? "var(--gold)" : "var(--dim)";
    return '<div class="vis-panel">' +
        '<div class="vis-title">Model Analysis</div>' +
        '<div class="vis-grid">' +
        '<div class="vis-block">' +
        '<div class="vis-row"><span class="vis-label">Outcome prob</span><span class="vis-val" style="color:' + pColor + '">' + prob + '%</span></div>' +
        '<div class="vis-track"><div class="vis-fill ' + pcl + '" style="width:' + prob + '%"></div></div>' +
        '<div class="vis-desc">' + probDesc(prob) + '</div>' +
        '</div>' +
        '<div class="vis-block">' +
        '<div class="vis-row"><span class="vis-label">Confidence</span><span class="vis-val" style="color:' + cColor + '">' + cp + '%</span></div>' +
        '<div class="vis-track"><div class="vis-fill ' + ccl + '" style="width:' + cp + '%"></div></div>' +
        '<div class="vis-desc">' + confDesc(conf) + '</div>' +
        '</div>' +
        '</div>' +
        '<div class="vis-block" style="margin-top:12px;padding-top:12px;border-top:1px solid #1a1d28;">' +
        '<div class="vis-row"><span class="vis-label">Fair price — ' + label + '</span><span class="vis-val" style="color:var(--neon);">' + fair + '</span></div>' +
        '<div class="fc-row"><span class="fc-label">Short</span><div class="fc-track"><div class="fc-pin" style="left:' + fp + '%"></div></div><span class="fc-label">Long</span></div>' +
        '<div class="vis-desc">' + fairLbl(fair) + '</div>' +
        '</div>' +
        '</div>';
}

// ── Predict ──
async function predict() {
    var idx = selectedIndex;
    var out = document.getElementById("output");
    if (idx === null || idx === undefined || isNaN(idx)) return;

    out.innerHTML = "<div class='loader'></div>";

    try {
        var res = await fetch(API + "/predict", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(fixturesData[idx])
        });
        if (!res.ok) {
            out.innerHTML = '<div class="error-msg">⚡ Prediction engine offline (' + res.status + '). Try again.</div>';
            return;
        }
        var d = await res.json();
        if (d.error) { out.innerHTML = '<div class="error-msg">⚡ ' + d.error + '</div>'; return; }

        var m      = fixturesData[idx];
        // Store verdict for menu actions
        d.match_key = (m.comp||"") + "_" + (m.home_id||idx) + "_" + (m.away_id||idx) + "_" + new Date().toISOString().split("T")[0];
        currentVerdict = d;
        activateMenu();

        var market = d.market || {};
        var probs  = d.probs  || { home: 33, draw: 33, away: 34 };

        // Confidence gap for vis panel
        var ps   = [probs.home, probs.draw, probs.away].sort(function(a,b) { return b-a; });
        var conf = (ps[0] - ps[1]) / 100;
        var topProb, topLabel, topFair;
        if (probs.home >= probs.draw && probs.home >= probs.away) {
            topProb = probs.home; topLabel = m.home + " Win"; topFair = market.home || 2.00;
        } else if (probs.away >= probs.home && probs.away >= probs.draw) {
            topProb = probs.away; topLabel = m.away + " Win"; topFair = market.away || 2.00;
        } else {
            topProb = probs.draw; topLabel = "Draw"; topFair = market.draw || 3.00;
        }

        // Store computed vis data so menuAiPrompt can include it
        currentVerdict._vis = {
            topProb:    topProb,
            topLabel:   topLabel,
            topFair:    topFair,
            confPctVal: confPct(conf),
            fairLblVal: fairLbl(topFair),
            confDesc:   confDesc(conf),
            probDesc:   probDesc(topProb),
        };
        currentVerdict._market = market;
        currentVerdict._fixture = m;

        var fav = probs.home > probs.away ? m.home : m.away;
        var maxP = Math.max(probs.home, probs.away);
        var btts = market.btts   ? Math.round((1/market.btts)*100)   : "?";
        var o25  = market.over25 ? Math.round((1/market.over25)*100) : "?";

        var verdict = "Projected scoreline: <b>" + d.score + "</b>. " +
            fav + " are favoured at <b>" + maxP + "%</b> win probability. " +
            "BTTS: <b>" + btts + "%</b>. Over 2.5: <b>" + o25 + "%</b>. " +
            "Enter bookie odds below to detect value.";

        out.innerHTML =
            '<div class="card">' +
            '<div class="teams-row">' +
            '<div class="team-block"><b>' + m.home + '</b><small>Rank #' + d.h_rank + '</small>' + renderForm(d.h_form,"left","Last 5 Home") + '</div>' +
            '<div class="team-block right"><b>' + m.away + '</b><small>Rank #' + d.a_rank + '</small>' + renderForm(d.a_form,"right","Last 5 Away") + '</div>' +
            '</div>' +
            '<div class="score">' + d.score + '</div>' +
            '<div class="lambda-row"><span>λ HOME ' + d.h_lam + '</span><span>⚪ POISSON</span><span>λ AWAY ' + d.a_lam + '</span></div>' +
            '<div class="prob-bar">' +
            '<div class="p-h" style="width:' + probs.home + '%">' + probs.home + '%</div>' +
            '<div class="p-d" style="width:' + probs.draw + '%">' + probs.draw + '%</div>' +
            '<div class="p-a" style="width:' + probs.away + '%">' + probs.away + '%</div>' +
            '</div>' +
            buildVisPanel(topProb, conf, topFair, topLabel) +
            buildSugPanel(d.suggested_markets || []) +
            '<div class="section-label">Fair Odds · Enter Bookie Price to Check Value · ¼ Kelly Staker</div>' +
            '<div class="bankroll-row"><label>Bankroll</label><span class="bankroll-symbol">€</span>' +
            '<input type="number" id="bankroll-input" value="1000" min="1" step="1" inputmode="decimal" placeholder="1000" oninput="refreshKellyStakes()"></div>' +
            '<table class="market-table"><thead><tr>' +
            '<th>Market</th><th>Fair Odds</th><th>Your Bookie</th><th>Value / Stake</th>' +
            '</tr></thead><tbody>' +
            mkRow("Home Win",     market.home,    "k-h") +
            mkRow("Draw",         market.draw,    "k-d") +
            mkRow("Away Win",     market.away,    "k-a") +
            mkRow("1X Home/Draw", market.dc_1x,   "k-dc1x") +
            mkRow("X2 Draw/Away", market.dc_x2,   "k-dcx2") +
            mkRow("12 Home/Away", market.dc_12,   "k-dc12") +
            mkRow("BTTS",         market.btts,    "k-btts") +
            mkRow("Over 1.5",     market.over15,  "k-o15") +
            mkRow("Over 2.5",     market.over25,  "k-o25") +
            mkRow("Over 3.5",     market.over35,  "k-o35") +
            mkRow("AH Home -0.5", market.ah_hm05, "k-ahm05") +
            mkRow("AH Home +0.5", market.ah_hp05, "k-ahp05") +
            mkRow("AH Home -1.5", market.ah_hm15, "k-ahm15") +
            mkRow("AH Home +1.5", market.ah_hp15, "k-ahp15") +
            '</tbody></table>' +
            '<div class="gaffer-box">' + verdict + '<div class="signature">— THE GAFFER</div></div>' +
            '</div>';

    } catch(e) {
        out.innerHTML = '<div class="error-msg">⚡ Connection lost. Check your link and retry.</div>';
    }
}
