<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE GAFFER | Tactical Intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
    :root {
        --neon:   #00ff9d;
        --bg:     #0a0b10;
        --card:   #151821;
        --border: #2a2d3a;
        --away:   #ff3366;
        --draw:   #8892b0;
        --dim:    #4a5060;
        --gold:   #ffcc00;
    }

    * { box-sizing: border-box; }

    body {
        background: var(--bg);
        color: #fff;
        font-family: Inter, sans-serif;
        display: flex;
        justify-content: center;
        padding: 20px;
        min-height: 100vh;
    }

    .container { width: 100%; max-width: 480px; }

    h1 {
        font-family: Orbitron, sans-serif;
        color: var(--neon);
        text-align: center;
        letter-spacing: 5px;
        font-size: 1.2rem;
        margin-bottom: 6px;
    }

    .tagline {
        text-align: center;
        font-size: 0.65rem;
        color: var(--dim);
        letter-spacing: 3px;
        text-transform: uppercase;
        margin-bottom: 24px;
    }

    .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 20px;
        margin-bottom: 20px;
    }

    input[type="date"],
    select {
        width: 100%;
        padding: 14px;
        margin-bottom: 12px;
        border-radius: 10px;
        background: #000;
        border: 1px solid var(--border);
        color: #fff;
        font-family: Inter, sans-serif;
        font-size: 0.9rem;
    }

    input[type="date"]:focus,
    select:focus { outline: 1px solid var(--neon); }

    button {
        width: 100%;
        padding: 14px;
        margin-bottom: 12px;
        border-radius: 10px;
        background: var(--neon);
        color: #000;
        font-weight: 800;
        font-family: Orbitron, sans-serif;
        font-size: 0.75rem;
        letter-spacing: 2px;
        cursor: pointer;
        border: none;
        transition: opacity 0.2s, box-shadow 0.2s;
    }

    button:hover:not(:disabled) {
        box-shadow: 0 0 18px rgba(0,255,157,0.35);
    }

    button:disabled {
        background: #1a1a1a;
        color: #444;
        cursor: not-allowed;
        box-shadow: none;
    }

    /* ── Bankroll input row ── */
    .bankroll-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
        background: #000;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 14px;
    }

    .bankroll-row label {
        font-size: 0.65rem;
        letter-spacing: 2px;
        color: var(--dim);
        text-transform: uppercase;
        white-space: nowrap;
        flex-shrink: 0;
    }

    .bankroll-symbol {
        font-family: Orbitron, sans-serif;
        font-size: 0.85rem;
        color: var(--neon);
        flex-shrink: 0;
    }

    #bankroll-input {
        flex: 1;
        background: transparent;
        border: none;
        color: var(--neon);
        font-family: Orbitron, sans-serif;
        font-size: 0.85rem;
        padding: 0;
        margin: 0;
        outline: none;
        width: 100%;
        min-width: 0;
    }

    #bankroll-input::-webkit-inner-spin-button,
    #bankroll-input::-webkit-outer-spin-button { -webkit-appearance: none; }

    /* ── Score ── */
    .score {
        font-family: Orbitron, sans-serif;
        font-size: 4rem;
        font-weight: 900;
        text-align: center;
        color: var(--neon);
        margin: 12px 0 4px;
        text-shadow: 0 0 24px rgba(0,255,157,0.4);
    }

    .lambda-row {
        display: flex;
        justify-content: center;
        gap: 20px;
        font-size: 0.65rem;
        color: var(--dim);
        letter-spacing: 1px;
        margin-bottom: 4px;
    }

    /* ── Prob bar ── */
    .prob-bar {
        display: flex;
        height: 24px;
        border-radius: 6px;
        overflow: hidden;
        margin: 16px 0;
        font-family: Orbitron, sans-serif;
        font-size: 0.65rem;
        line-height: 24px;
        text-align: center;
    }

    .p-h { background: var(--neon); color: #000; min-width: 28px; }
    .p-d { background: var(--draw); color: #000; min-width: 28px; }
    .p-a { background: var(--away); color: #000; min-width: 28px; }

    .form-row { display: flex; gap: 3px; margin-top: 4px; flex-wrap: wrap; }

    .dot {
        width: 20px; height: 20px;
        border-radius: 4px;
        font-size: 10px;
        line-height: 20px;
        text-align: center;
        color: #000;
        font-weight: 700;
        display: inline-block;
    }

    .W { background: var(--neon); }
    .D { background: var(--draw); }
    .L { background: var(--away); }
    .Q { background: #2a2d3a; color: #556; border: 1px solid #333; }

    .form-venue-label {
        font-size: 0.58rem;
        letter-spacing: 2px;
        color: var(--dim);
        text-transform: uppercase;
        margin-top: 6px;
        margin-bottom: 2px;
    }

    .teams-row {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        font-size: 0.82rem;
        margin-bottom: 4px;
    }

    .team-block { width: 48%; }
    .team-block.right { text-align: right; }
    .team-block b { font-size: 0.9rem; display: block; margin-bottom: 2px; }
    .team-block small { color: var(--dim); font-size: 0.7rem; }
    .team-block .form-row.right { justify-content: flex-end; }
    .team-block.right .form-venue-label { text-align: right; }

    .section-label {
        font-size: 0.6rem;
        letter-spacing: 3px;
        color: var(--dim);
        text-transform: uppercase;
        margin: 16px 0 8px;
        border-top: 1px solid #1a1d28;
        padding-top: 12px;
    }

    .market-table { width: 100%; border-collapse: collapse; }

    .market-table th {
        font-size: 0.6rem;
        letter-spacing: 2px;
        color: var(--dim);
        text-transform: uppercase;
        padding: 4px 0 8px;
        text-align: left;
        font-weight: 400;
    }

    .market-table th:last-child,
    .market-table td:last-child { text-align: right; }

    .market-row-tr {
        border-top: 1px solid #1a1d28;
        transition: background 0.25s;
    }

    .market-row-tr td {
        padding: 10px 4px;
        font-size: 0.8rem;
        vertical-align: middle;
    }

    .fair-price {
        font-family: Orbitron, sans-serif;
        font-size: 0.75rem;
        color: var(--neon);
    }

    .bookie-input {
        width: 72px;
        padding: 7px 8px;
        border-radius: 7px;
        background: #000;
        border: 1px solid var(--border);
        color: #fff;
        font-family: Orbitron, sans-serif;
        font-size: 0.72rem;
        text-align: center;
        transition: border-color 0.2s;
    }

    .bookie-input:focus { outline: none; border-color: var(--neon); }

    .kelly-result {
        font-family: Orbitron, sans-serif;
        font-size: 0.72rem;
        color: var(--dim);
        min-width: 80px;
        text-align: right;
    }

    .market-row-tr.value {
        background: rgba(0,255,157,0.05);
    }

    .market-row-tr.value td:first-child {
        border-left: 2px solid var(--neon);
        padding-left: 8px;
    }

    .prime {
        color: var(--neon);
        font-weight: 700;
        animation: pulse-text 2s ease-in-out infinite;
    }

    @keyframes pulse-text {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0.6; }
    }

    .no-value  { color: #3a3f50; }
    .thin-edge { color: var(--draw); font-size: 0.65rem; }

    /* ── Market type badges ── */
    .mkt-badge {
        display: inline-block;
        font-family: Orbitron, sans-serif;
        font-size: 0.55rem;
        font-weight: 700;
        letter-spacing: 1px;
        padding: 2px 7px;
        border-radius: 4px;
        margin-left: 6px;
        vertical-align: middle;
    }
    .mkt-1X2   { background: rgba(0,255,157,0.12);  color: var(--neon); border: 1px solid rgba(0,255,157,0.25); }
    .mkt-DC    { background: rgba(79,195,247,0.12); color: #4fc3f7;     border: 1px solid rgba(79,195,247,0.25); }
    .mkt-AH    { background: rgba(255,152,0,0.12);  color: #ff9800;     border: 1px solid rgba(255,152,0,0.25); }
    .mkt-Goals { background: rgba(255,204,0,0.12);  color: var(--gold); border: 1px solid rgba(255,204,0,0.25); }

    /* ── Top pick banner ── */
    .top-pick-banner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(0,255,157,0.06);
        border: 1px solid rgba(0,255,157,0.2);
        border-radius: 10px;
        padding: 10px 14px;
        margin-bottom: 12px;
    }
    .top-pick-label { font-size: 0.6rem; letter-spacing: 2px; color: var(--dim); text-transform: uppercase; }
    .top-pick-value { font-family: Orbitron, sans-serif; font-size: 0.8rem; color: var(--neon); font-weight: 700; }
    .top-pick-edge  { font-family: Orbitron, sans-serif; font-size: 0.7rem; color: var(--neon); animation: pulse-text 2s ease-in-out infinite; }

    .gaffer-box {
        background: rgba(0,255,157,0.04);
        border-left: 3px solid var(--neon);
        border-radius: 0 8px 8px 0;
        padding: 14px 16px;
        margin-top: 16px;
        font-size: 0.82rem;
        line-height: 1.65;
        color: #b0bcc8;
    }

    .gaffer-box .signature {
        font-family: Orbitron, sans-serif;
        color: var(--neon);
        font-size: 0.65rem;
        letter-spacing: 3px;
        text-align: right;
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid rgba(0,255,157,0.1);
    }

    .loader {
        border: 3px solid #1a1d28;
        border-top: 3px solid var(--neon);
        border-radius: 50%;
        width: 32px;
        height: 32px;
        margin: 20px auto;
        animation: spin 0.9s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .status-msg {
        text-align: center;
        font-size: 0.75rem;
        color: var(--dim);
        padding: 10px 0;
    }

    /* ── Fixture list cards ── */
    .fixture-list { margin-bottom: 12px; }

    .fixture-card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #000;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
        margin-bottom: 6px;
        cursor: pointer;
        transition: border-color 0.2s, background 0.2s;
        user-select: none;
        min-width: 0;           /* critical: allows flex children to shrink */
        overflow: hidden;
    }
    .fixture-card:hover     { border-color: #3a3f50; background: #080a10; }
    .fixture-card.selected  { border-color: var(--neon); background: rgba(0,255,157,0.04); }
    .fixture-card.has-value { border-color: rgba(0,255,157,0.4); }
    .fixture-card.no-value  { opacity: 0.6; }

    .fx-left {
        flex: 1;
        min-width: 0;           /* allows text to truncate rather than overflow */
        overflow: hidden;
    }
    .fx-teams {
        font-size: 0.78rem;
        font-weight: 600;
        color: #dde;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .fx-meta {
        font-size: 0.58rem;
        color: var(--dim);
        margin-top: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .fx-right {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 4px;
        flex-shrink: 0;         /* badge column never shrinks */
        margin-left: 8px;
    }
    .fx-value-badge {
        font-family: Orbitron, sans-serif;
        font-size: 0.52rem;
        font-weight: 700;
        letter-spacing: 0.5px;
        padding: 2px 6px;
        border-radius: 4px;
        white-space: nowrap;
        max-width: 140px;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .badge-value   { background: rgba(0,255,157,0.15); color: var(--neon); border: 1px solid rgba(0,255,157,0.3); }
    .badge-novalue { background: rgba(136,146,176,0.1); color: var(--dim); border: 1px solid rgba(136,146,176,0.15); }
    .badge-unknown { background: rgba(74,80,96,0.2);    color: var(--dim); border: 1px solid rgba(74,80,96,0.2); }

    .fx-time {
        font-family: Orbitron, sans-serif;
        font-size: 0.58rem;
        color: var(--dim);
    }
</style>
</head>
<body>
<div class="container">

    <h1>THE GAFFER</h1>
    <p class="tagline">Tactical Intelligence · Poisson Engine</p>

    <div class="card">
        <input type="date" id="date">

        <button onclick="getFixtures()">SCAN TACTICAL BOARD</button>
        <div id="fixture-list" class="fixture-list"></div>
        <button id="btn" onclick="predict()" disabled>GET VERDICT</button>
        <button onclick="window.location.href='acca.html'" style="background:#000;color:var(--neon);border:1px solid var(--neon);margin-bottom:0;">⚡ ACCA BUILDER</button>
        <button onclick="window.location.href='session.html'" style="background:#000;color:#ffcc00;border:1px solid #ffcc00;margin-top:12px;margin-bottom:0;">🎯 MASANIELLO</button>
    </div>

    <div id="output"></div>

</div>

<script>
const API = "https://football-api-9e4p.onrender.com";
let fixturesData  = [];
let selectedIndex = null;

function getBankroll() {
    const el = document.getElementById("bankroll-input");
    const val = el ? parseFloat(el.value) : 1000;
    return (!val || isNaN(val) || val <= 0) ? 1000 : val;
}

function refreshKellyStakes() {
    document.querySelectorAll(".bookie-input").forEach(input => {
        if (input.value) {
            const fairOdds = parseFloat(input.dataset.fair || "0");
            const kellyId  = input.dataset.kelly;
            if (fairOdds && kellyId) calcKelly(input, fairOdds, kellyId);
        }
    });
}

document.getElementById("date").value = new Date().toISOString().split("T")[0];

function selectFixture(idx) {
    selectedIndex = idx;
    document.querySelectorAll(".fixture-card").forEach((c, i) => {
        // match by data-idx since cards may be sorted differently from fixturesData order
        c.classList.toggle("selected", parseInt(c.dataset.idx) === idx);
    });
    document.getElementById("btn").disabled = false;
    document.getElementById("output").innerHTML = "";
}

function renderFixtureList(fixtures) {
    const list = document.getElementById("fixture-list");
    if (!fixtures.length) {
        list.innerHTML = `<div class="status-msg">No matches found for this date.</div>`;
        return;
    }

    // Sort: value first, then unknown, then no-value; within each group by kickoff
    const sorted = fixtures.map((m, i) => ({...m, _origIdx: i}));
    sorted.sort((a, b) => {
        const rank = s => s === "value" ? 0 : s === "unknown" ? 1 : 2;
        const dr = rank(a.value_status) - rank(b.value_status);
        if (dr !== 0) return dr;
        return (a.kickoff || a.date) < (b.kickoff || b.date) ? -1 : 1;
    });

    list.innerHTML = sorted.map(m => {
        const idx = m._origIdx;

        let timeStr = "";
        if (m.kickoff && m.kickoff.length > 10) {
            try { timeStr = new Date(m.kickoff).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}); }
            catch(e) {}
        }

        let badge = "";
        if (m.value_status === "value" && m.best_edge_mkt) {
            badge = `<span class="fx-value-badge badge-value">⚡ +${m.best_edge}% · ${m.best_edge_mkt.label}</span>`;
        } else if (m.value_status === "no_value") {
            badge = `<span class="fx-value-badge badge-novalue">— No edge</span>`;
        } else {
            badge = `<span class="fx-value-badge badge-unknown">? Odds pending</span>`;
        }

        const cardClass = m.value_status === "value" ? "has-value"
                        : m.value_status === "no_value" ? "no-value" : "";

        return `<div class="fixture-card ${cardClass}" data-idx="${idx}" onclick="selectFixture(${idx})">
            <div class="fx-left">
                <div class="fx-teams">${m.home} vs ${m.away}</div>
                <div class="fx-meta">${m.league}</div>
            </div>
            <div class="fx-right">
                ${timeStr ? `<div class="fx-time">${timeStr}</div>` : ""}
                ${badge}
            </div>
        </div>`;
    }).join("");
}

function renderForm(str, align = "left", venueLabel = "") {
    const isRight      = align === "right";
    const justifyStyle = `justify-content:${isRight ? "flex-end" : "flex-start"}`;
    const labelHtml    = venueLabel
        ? `<div class="form-venue-label">${venueLabel}</div>`
        : "";

    if (!str || str === "???") {
        return `${labelHtml}<div class="form-row" style="${justifyStyle}">
            <div class="dot Q">?</div><div class="dot Q">?</div><div class="dot Q">?</div>
        </div>`;
    }

    const dots = str.split("").map(c => {
        const cls = ["W","D","L"].includes(c) ? c : "Q";
        return `<div class="dot ${cls}">${c}</div>`;
    }).join("");

    return `${labelHtml}<div class="form-row" style="${justifyStyle}">${dots}</div>`;
}

async function getFixtures() {
    const d    = document.getElementById("date").value;
    const list = document.getElementById("fixture-list");
    const out  = document.getElementById("output");

    if (!d) return;

    selectedIndex = null;
    document.getElementById("btn").disabled = true;
    out.innerHTML = "";
    list.innerHTML = `<div class="status-msg"><div class="loader" style="width:20px;height:20px;margin:8px auto 4px;border-width:2px;"></div>Scanning fixtures...</div>`;

    try {
        // Use /scan for the single date — returns fixtures with edge detection
        const res  = await fetch(`${API}/scan?date_from=${d}&date_to=${d}`);
        const data = await res.json();

        if (data.status === "loading") {
            list.innerHTML = `<div class="status-msg">Server syncing — refresh in ~30s.</div>`;
            return;
        }
        if (data.error) {
            list.innerHTML = `<div class="error-msg">⚡ ${data.error}</div>`;
            return;
        }
        if (data.status === "no_games") {
            list.innerHTML = `<div class="status-msg">📋 No matches scheduled for this date.</div>`;
            return;
        }

        fixturesData = Array.isArray(data) ? data : [];

        if (!fixturesData.length) {
            list.innerHTML = `<div class="status-msg">No matches found for this date.</div>`;
            return;
        }

        renderFixtureList(fixturesData);

    } catch (e) {
        list.innerHTML = `<div class="error-msg">⚡ Connection lost. Check your link and retry.</div>`;
    }
}

function calcKelly(inputEl, fairOdds, targetId) {
    const target   = document.getElementById(targetId);
    const row      = inputEl.closest(".market-row-tr");
    const val      = parseFloat(inputEl.value);
    const bankroll = getBankroll();

    row.classList.remove("value");

    if (!val || isNaN(val) || val <= 1.0 || !fairOdds || fairOdds <= 1) {
        target.innerHTML = `<span class="no-value">--</span>`;
        return;
    }

    const p      = 1 / fairOdds;
    const q      = 1 - p;
    const b      = val - 1;
    const f_star = (b * p - q) / b;
    const edge   = (val / fairOdds) - 1;

    if (edge <= 0.05) {
        target.innerHTML = edge > 0
            ? `<span class="thin-edge">Thin</span>`
            : `<span class="no-value">No edge</span>`;
        return;
    }

    if (f_star <= 0) {
        target.innerHTML = `<span class="no-value">No edge</span>`;
        return;
    }

    const stake = (0.25 * f_star * bankroll).toFixed(2);
    row.classList.add("value");
    target.innerHTML = `<span class="prime">★ €${stake}</span>`;
}

async function predict() {
    const idx = selectedIndex;
    const out = document.getElementById("output");

    if (idx === null || idx === undefined) return;

    out.innerHTML = "<div class='loader'></div>";

    try {
        const res = await fetch(`${API}/predict`, {
            method:  "POST",
            headers: { "Content-Type": "application/json" },
            body:    JSON.stringify(fixturesData[idx])
        });

        if (!res.ok) {
            out.innerHTML = `<div class="error-msg">⚡ Prediction engine offline (${res.status}). Try again.</div>`;
            return;
        }

        const d = await res.json();

        if (d.error) {
            out.innerHTML = `<div class="error-msg">⚡ ${d.error}</div>`;
            return;
        }

        const m        = fixturesData[idx];
        const market   = d.market   || {};
        const apiOdds  = d.api_odds || {};
        const edges    = d.edges    || {};
        const topPick  = d.top_pick || {};

        // Market row — shows api_odds (real bookie price) when available
        const mkRow = (label, fairKey, kellyId, mktType) => {
            const fairVal  = market[fairKey];
            const apiVal   = apiOdds[fairKey];
            const edgeVal  = edges[fairKey] || 0;
            const dispOdds = apiVal || fairVal || "--";
            const edgeBadge = edgeVal > 0.05
                ? `<span style="font-size:0.58rem;color:var(--neon);margin-left:4px;">+${(edgeVal*100).toFixed(0)}%</span>`
                : edgeVal > 0 ? `<span style="font-size:0.58rem;color:var(--draw);margin-left:4px;">thin</span>` : "";
            return `
            <tr class="market-row-tr ${edgeVal > 0.05 ? 'value' : ''}" id="row-${kellyId}">
                <td>${label}${edgeBadge}</td>
                <td class="fair-price" title="Fair: ${fairVal || '--'}">${dispOdds}</td>
                <td>
                    <input type="number" class="bookie-input" placeholder="Odds"
                        step="0.01" min="1.01" inputmode="decimal"
                        data-fair="${fairVal || 0}" data-kelly="${kellyId}"
                        oninput="calcKelly(this, ${fairVal || 0}, '${kellyId}')">
                </td>
                <td class="kelly-result" id="${kellyId}"><span class="no-value">--</span></td>
            </tr>`;
        };

        // Top pick banner — FIX 6: honest no-edge display
        let topPickHtml = "";
        if (topPick && topPick.label && !topPick.no_value) {
            const typeBadge = topPick.type
                ? `<span class="mkt-badge mkt-${topPick.type}">${topPick.type}</span>` : "";
            const edgeStr = topPick.edge > 0.05
                ? `★ +${(topPick.edge*100).toFixed(1)}% EDGE` : "";
            topPickHtml = `
            <div class="top-pick-banner">
                <div>
                    <div class="top-pick-label">Value Detected</div>
                    <div class="top-pick-value">${topPick.label}${typeBadge}</div>
                    ${topPick.api ? `<div style="font-size:0.65rem;color:var(--dim);margin-top:2px;">Bookie: ${topPick.api} · Fair: ${topPick.fair}</div>`
                                  : `<div style="font-size:0.65rem;color:var(--dim);margin-top:2px;">Fair: ${topPick.fair}</div>`}
                </div>
                <div class="top-pick-edge">${edgeStr}</div>
            </div>`;
        } else if (topPick && topPick.no_value) {
            // FIX 6: No edge detected — show honest signal rather than fake recommendation
            topPickHtml = `
            <div style="background:rgba(136,146,176,0.06);border:1px solid rgba(136,146,176,0.2);border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px;">
                <span style="font-size:1rem;">—</span>
                <div>
                    <div style="font-size:0.6rem;letter-spacing:2px;color:var(--dim);text-transform:uppercase;">No Strong Value Detected</div>
                    <div style="font-size:0.72rem;color:var(--draw);margin-top:3px;">${topPick.reason || 'All markets appear efficiently priced'}</div>
                </div>
            </div>`;
        }

        const h_w      = d.probs.home > d.probs.away;
        const fav      = h_w ? m.home : m.away;
        const conf     = Math.max(d.probs.home, d.probs.away);
        const btts_pct = market.btts   ? Math.round((1 / market.btts)   * 100) : "?";
        const o25_pct  = market.over25 ? Math.round((1 / market.over25) * 100) : "?";

        const verdict = `
            Projected scoreline: <b>${d.score}</b>.
            ${fav} are favoured at <b>${conf}%</b> win probability.
            Both teams to score probability: <b>${btts_pct}%</b>.
            Over 2.5 goals probability: <b>${o25_pct}%</b>.
            Enter bookie odds in the table above to detect value and calculate ¼-Kelly stakes.
        `.trim();

        out.innerHTML = `
        <div class="card">
            <div class="teams-row">
                <div class="team-block">
                    <b>${m.home}</b>
                    <small>Rank #${d.h_rank}</small>
                    ${renderForm(d.h_form, "left", "Last 5 Home")}
                </div>
                <div class="team-block right">
                    <b>${m.away}</b>
                    <small>Rank #${d.a_rank}</small>
                    ${renderForm(d.a_form, "right", "Last 5 Away")}
                </div>
            </div>

            <div class="score">${d.score}</div>
            <div class="lambda-row">
                <span>λ HOME ${d.h_lam}</span>
                <span>${d.blended ? '🔵 BAYESIAN' : '⚪ POISSON'}</span>
                <span>λ AWAY ${d.a_lam}</span>
            </div>

            <div class="prob-bar">
                <div class="p-h" style="width:${d.probs.home}%">${d.probs.home}%</div>
                <div class="p-d" style="width:${d.probs.draw}%">${d.probs.draw}%</div>
                <div class="p-a" style="width:${d.probs.away}%">${d.probs.away}%</div>
            </div>

            ${topPickHtml}

            <div class="section-label">Market Comparison · ¼ Kelly Staker</div>

            <div class="bankroll-row">
                <label>Bankroll</label>
                <span class="bankroll-symbol">€</span>
                <input type="number" id="bankroll-input" value="1000" min="1"
                    step="1" inputmode="decimal" placeholder="1000"
                    oninput="refreshKellyStakes()">
            </div>

            <table class="market-table">
                <thead>
                    <tr>
                        <th>Market</th>
                        <th>Odds</th>
                        <th>Enter Bookie</th>
                        <th>Stake</th>
                    </tr>
                </thead>
                <tbody>
                    ${mkRow("Home Win",       "home",   "k-h",    "1X2")}
                    ${mkRow("Draw",           "draw",   "k-d",    "1X2")}
                    ${mkRow("Away Win",       "away",   "k-a",    "1X2")}
                    ${mkRow("1X Home/Draw",   "dc_1x",  "k-dc1x", "DC")}
                    ${mkRow("X2 Draw/Away",   "dc_x2",  "k-dcx2", "DC")}
                    ${mkRow("12 Home/Away",   "dc_12",  "k-dc12", "DC")}
                    ${mkRow("BTTS",           "btts",   "k-btts", "Goals")}
                    ${mkRow("Over 1.5",       "over15", "k-o15",  "Goals")}
                    ${mkRow("Over 2.5",       "over25", "k-o25",  "Goals")}
                    ${mkRow("Over 3.5",       "over35", "k-o35",  "Goals")}
                    ${mkRow("AH Home -0.5",   "ah_hm05","k-ahm05","AH")}
                    ${mkRow("AH Home +0.5",   "ah_hp05","k-ahp05","AH")}
                    ${mkRow("AH Home -1.5",   "ah_hm15","k-ahm15","AH")}
                    ${mkRow("AH Home +1.5",   "ah_hp15","k-ahp15","AH")}
                </tbody>
            </table>

            <div class="gaffer-box">
                ${verdict}
                <div class="signature">— THE GAFFER</div>
            </div>
        </div>`;

    } catch (e) {
        out.innerHTML = `<div class="error-msg">⚡ Connection lost. Check your link and retry.</div>`;
    }
}
</script>
</body>
</html>
